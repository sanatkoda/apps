const fontSizeVal = document.getElementById("fontSizeVal");

const countEl = document.getElementById("count");
const scopeEl = document.getElementById("scope");
const hintEl = document.getElementById("hint");
const listEl = document.getElementById("list");

// Szöveg formázó és kiemelő segédfunkciók (A pontosan működő kód alapján)
function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function truncateToThreeWords(text) {
  if (!text) return '';
  const words = text.trim().split(/\s+/);
  return words.slice(0, 3).join(' ') + (words.length > 3 ? '...' : '');
}

function highlight(text, query) {
  const escaped = escapeHtml(text);
  if (!query || !query.trim()) return escaped;
  const q = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${q})`, 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

function formatContent(text, isThreeWordsActive, query) {
  if (!text) return '';
  let content = isThreeWordsActive ? truncateToThreeWords(text) : text;
  return highlight(content, query);
}

// Szűrők elrejtése / megjelenítése
toggleFiltersBtn.addEventListener("click", () => {
  filterPanel.classList.toggle("open");
});

// Betűméret csúszka
fontSizeSlider.addEventListener("input", (e) => {
  const val = e.target.value + "px";
  fontSizeVal.textContent = val;
  document.querySelectorAll(".poem, .hun, .word").forEach(el => el.style.fontSize = val);
  saveState();
});

// Szak fülek
tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentSzak = tab.getAttribute("data-sz");
    populateSemesters();
    populateCourses();
    currentIndex = 0;
    applyFilters();
  });
});

// Félévek feltöltése a kiválasztott szak alapján
function populateSemesters() {
  const items = DATA[currentSzak] || [];
  const sems = [...new Set(items.map(i => i["Félév"]))].sort((a,b) => Number(a) - Number(b));
  semEl.innerHTML = '<option value="all">Összes félév</option>' + 
    sems.map(s => `<option value="${s}">${s}. félév</option>`).join("");
}

// Kurzusok feltöltése a félév és mód alapján
function populateCourses() {
  const items = DATA[currentSzak] || [];
  const selectedSem = semEl.value;
  const selectedMode = modeEl.value;

  let filtered = items;
  if (selectedSem !== "all") {
    if (selectedMode === "upto") {
      filtered = items.filter(i => Number(i["Félév"]) <= Number(selectedSem));
    } else {
      filtered = items.filter(i => i["Félév"] === selectedSem);
    }
  }

  const courses = [...new Set(filtered.map(i => i["Kurzusnév"]))];
  const currentVal = courseEl.value;
  courseEl.innerHTML = '<option value="all">Összes kurzus</option>' + 
    courses.map(c => `<option value="${c}">${c}</option>`).join("");
  
  if (courses.includes(currentVal)) {
    courseEl.value = currentVal;
  } else {
    courseEl.value = "all";
  }
}

// Szűrési logika
function filterData() {
  let items = DATA[currentSzak] || [];
  const sem = semEl.value;
  const course = courseEl.value;
  const mode = modeEl.value;
  const query = searchEl.value.trim().toLowerCase();

  if (sem !== "all") {
    if (mode === "upto") {
      items = items.filter(i => Number(i["Félév"]) <= Number(sem));
    } else {
      items = items.filter(i => i["Félév"] === sem);
    }
  }

  if (course !== "all") {
    items = items.filter(i => i["Kurzusnév"] === course);
  }

  if (query) {
    items = items.filter(i => {
      const text = (i["Vers / forrás"] + " " + i["Kurzusnév"] + " " + i["Versszöveg"] + " " + (i["Magyar fordítás"]||"") + " " + (i["Szavankénti fordítás"]||"")).toLowerCase();
      return text.includes(query);
    });
  }

  return items;
}

function updateScopeAndMeta() {
  countEl.textContent = `${currentVerses.length} vers`;
  let scopeText = currentSzak;
  if (semEl.value !== "all") scopeText += ` | ${semEl.value}. félév` + (modeEl.value === "upto" ? " (eddig)" : "");
  if (courseEl.value !== "all") scopeText += ` | ${courseEl.value}`;
  scopeEl.textContent = scopeText;
}

// Megjelenítés
function render() {
  if (currentVerses.length === 0) {
    listEl.innerHTML = '<div class="verse"><p style="text-align:center;color:var(--muted);">Nincs a szűrésnek megfelelő vers.</p></div>';
    navInfo.textContent = "0 / 0";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    saveState();
    return;
  }

  if (currentIndex < 0) currentIndex = 0;
  if (currentIndex >= currentVerses.length) currentIndex = currentVerses.length - 1;

  const verse = currentVerses[currentIndex];
  navInfo.textContent = `${currentIndex + 1} / ${currentVerses.length}`;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === currentVerses.length - 1;

  const fontSize = fontSizeSlider.value + "px";
  const query = searchEl.value;
  const isThree = threeWords.checked;

  let poemContent = "";
  if (showPoem.checked) {
    poemContent = `<div class="poem" style="font-size:${fontSize}">${formatContent(verse["Versszöveg"], isThree, query)}</div>`;
  }

  let hunContent = "";
  if (showHun.checked && verse["Magyar fordítás"]) {
    hunContent = `<div class="hun" style="font-size:${fontSize}"><strong>Magyar fordítás:</strong><br>${formatContent(verse["Magyar fordítás"], isThree, query)}</div>`;
  }

  let wordContent = "";
  if (showWord.checked && verse["Szavankénti fordítás"]) {
    wordContent = `<div class="word" style="font-size:${fontSize}"><strong>Szavankénti fordítás:</strong><br>${formatContent(verse["Szavankénti fordítás"], isThree, query)}</div>`;
  }

  listEl.innerHTML = `
    <div class="verse">
      <div class="top">
        <span class="src">${highlight(verse["Vers / forrás"], query)}</span>
        <span class="course">${highlight(verse["Kurzusnév"], query)} (${verse["Félév"]}. félév)</span>
      </div>
      ${poemContent}
      ${hunContent}
      ${wordContent}
    </div>
  `;

  saveState();
}

// Állapot mentése a LocalStorage-ba
function saveState() {
  const currentVerse = currentVerses[currentIndex];
  const state = {
    szak: currentSzak,
    sem: semEl.value,
    course: courseEl.value,
    mode: modeEl.value,
    search: searchEl.value,
    fontSize: fontSizeSlider.value,
    showPoem: showPoem.checked,
    showHun: showHun.checked,
    showWord: showWord.checked,
    threeWords: threeWords.checked,
    verseId: currentVerse ? (currentVerse["Vers / forrás"] + "___" + currentVerse["Kurzusnév"]) : null,
    index: currentIndex
  };
  localStorage.setItem("verse_app_saved_state", JSON.stringify(state));
}

// Állapot betöltése
function loadState() {
  try {
    const raw = localStorage.getItem("verse_app_saved_state");
    return raw ? JSON.parse(raw) : null;
  } catch(e) {
    return null;
  }
}

function applyFilters(targetVerseId = null) {
  currentVerses = filterData();
  updateScopeAndMeta();

  if (targetVerseId) {
    const foundIdx = currentVerses.findIndex(v => (v["Vers / forrás"] + "___" + v["Kurzusnév"]) === targetVerseId);
    if (foundIdx !== -1) {
      currentIndex = foundIdx;
    }
  }
  
  if (currentIndex >= currentVerses.length) {
    currentIndex = Math.max(0, currentVerses.length - 1);
  }

  render();
}

// Eseménykezelők
prevBtn.addEventListener("click", () => {
  if (currentIndex > 0) {
    currentIndex--;
    render();
  }
});

nextBtn.addEventListener("click", () => {
  if (currentIndex < currentVerses.length - 1) {
    currentIndex++;
    render();
  }
});

semEl.addEventListener("change", () => {
  populateCourses();
  currentIndex = 0;
  applyFilters();
});

modeEl.addEventListener("change", () => {
  populateCourses();
  currentIndex = 0;
  applyFilters();
});

courseEl.addEventListener("change", () => {
  currentIndex = 0;
  applyFilters();
});

searchEl.addEventListener("input", () => {
  currentIndex = 0;
  applyFilters();
});

[showPoem, showHun, showWord, threeWords].forEach(chk => {
  chk.addEventListener("change", () => render());
});

// Inicializálás az elmentett állapot alapján
function init() {
  const saved = loadState();

  if (saved) {
    if (saved.szak && DATA[saved.szak]) {
      currentSzak = saved.szak;
      tabs.forEach(t => {
        if (t.getAttribute("data-sz") === currentSzak) t.classList.add("active");
        else t.classList.remove("active");
      });
    }

    populateSemesters();
    if (saved.sem) semEl.value = saved.sem;

    if (saved.mode) modeEl.value = saved.mode;

    populateCourses();
    if (saved.course) courseEl.value = saved.course;

    if (saved.search !== undefined) searchEl.value = saved.search;
    if (saved.fontSize) {
      fontSizeSlider.value = saved.fontSize;
      fontSizeVal.textContent = saved.fontSize + "px";
    }

    if (saved.showPoem !== undefined) showPoem.checked = saved.showPoem;
    if (saved.showHun !== undefined) showHun.checked = saved.showHun;
    if (saved.showWord !== undefined) showWord.checked = saved.showWord;
    if (saved.threeWords !== undefined) threeWords.checked = saved.threeWords;

    if (saved.index !== undefined) currentIndex = saved.index;

    applyFilters(saved.verseId);
  } else {
    populateSemesters();
    populateCourses();
    applyFilters();
  }
}

init();
</script>
