<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vers tanuló alkalmazás</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#4f46e5;--accent2:#059669;}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:1200px;margin:18px auto;padding:18px}
.panel,.verse{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.panel{padding:14px;margin-bottom:16px}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px} select,input[type="text"],input[type="range"]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px}
input[type="range"]{padding:6px;cursor:pointer}
.checkbox-group{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.checkbox-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;margin-bottom:0}
.checkbox-label input[type="checkbox"]{width:16px;height:16px;cursor:pointer}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tab{border:none;border-radius:999px;padding:12px 16px;background:#e5e7eb;color:#111827;font-weight:700;cursor:pointer}.tab.active{background:var(--accent);color:#fff}.navbtn{border:none;border-radius:999px;padding:12px 20px;background:#e5e7eb;color:#111827;font-weight:700;cursor:pointer}.navbtn:disabled{opacity:.4;cursor:not-allowed}
.gear-btn{border:none;background:#e5e7eb;color:#111827;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:background 0.2s}
.gear-btn:hover{background:var(--line)}
.filter-panel{display:none;margin-bottom:16px;}
.filter-panel.open{display:block;}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:10px 2px}
.list{display:grid;gap:12px;margin-bottom:16px;}.verse{padding:14px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}.src{font-weight:800;color:var(--accent)}.course{font-weight:700;color:var(--accent2)}
.poem{white-space:pre-wrap;line-height:1.55;font-weight:600}.hun{margin-top:10px;line-height:1.6}.word{margin-top:10px;color:#374151;background:#f9fafb;border-radius:12px;padding:10px;white-space:pre-wrap;line-height:1.5}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
mark{background:#fef08a;color:#854d0e;padding:0 2px;border-radius:3px;}
@media (max-width:1000px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}}
@media (max-width:600px){.row{grid-template-columns:1fr}.top{flex-direction:column}}
</style>
</head>
<body>
<main>
  <!-- TOP PANEL: Navigáció + Jelölőboxok + Fogaskerék gomb -->
  <div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="navbtn" id="prevBtn">Vissza</button>
      <div id="navInfo" style="font-weight:700;color:#374151;">0 / 0</div>
      <button class="navbtn" id="nextBtn">Előre</button>
    </div>

    <div style="display:flex;align-items:center;gap:16px;">
      <div class="checkbox-group">
        <label class="checkbox-label"><input type="checkbox" id="showPoem" checked> Szanszkrit vers</label>
        <label class="checkbox-label"><input type="checkbox" id="showHun" checked> Magyar fordítás</label>
        <label class="checkbox-label"><input type="checkbox" id="showWord" checked> Szó szerinti fordítás</label>
        <label class="checkbox-label" style="color:var(--accent);"><input type="checkbox" id="threeWords"> 3 szó</label>
      </div>
      <button class="gear-btn" id="toggleFiltersBtn" title="Szűrők beállítása">⚙</button>
    </div>
  </div>

  <!-- REJTETT SZŰRŐ PANEL -->
  <div class="panel filter-panel" id="filterPanel">
    <div class="tabs">
      <button class="tab active" data-sz="Jógamester">BHF Jógamester szak</button>
      <button class="tab" data-sz="Teológia">BHF Vaisnava teológia szak</button>
    </div>
    <div class="row">
      <div><label for="sem">Félév</label><select id="sem"></select></div>
      <div><label for="course">Kurzus</label><select id="course"></select></div>
      <div>
        <label for="mode">Megjelenítés</label>
        <select id="mode">
          <option value="semester">Csak az adott félév versei</option>
          <option value="upto">Az adott félévig tanult összes vers</option>
        </select>
      </div>
      <div><label for="search">Keresés</label><input id="search" placeholder="Szöveg, forrás, kurzus..."></div>
      <div>
        <label for="fontSizeSlider">Betűméret: <span id="fontSizeVal">16px</span></label>
        <input type="range" id="fontSizeSlider" min="12" max="28" value="16">
      </div>
    </div>

    <div class="row2">
      <div class="meta"><div><span class="badge" id="count">0 vers</span></div><div id="scope">—</div></div>
      <div class="meta" style="justify-content:flex-end"><div id="hint">Válassz szakot és szűrőket.</div></div>
    </div>
  </div>

  <!-- VERS MEGJELENÍTÉSE -->
  <div class="list" id="list"></div>
</main>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker regisztrálva:', reg.scope))
        .catch(err => console.error('Service Worker regisztrációs hiba:', err));
    });
  }
const DATA = {"Jógamester": [{"Félév": "1", "Kurzusnév": "Bhagavad-gītā 1.", "Vers / forrás": "2.13. VERS", "Versszöveg": "dehino 'smin yathā dehe \nkaumāraṁ yauvanaṁ jarā\ntathā dehāntara-prāptir \ndhīras tatra na muhyati", "Magyar fordítás": "Amint a megtestesült lélek állandóan vándorol ebben a testben a gyermekkortól a serdülőkoron át az öregkorig, a halál pillanatában is egy másik testbe költözik. A józan embert azonban nem téveszti meg az efféle változás.", "Szavankénti fordítás": "dehinaḥ – a megtestesültnek; asmin – ebben; yathā – mint; dehe – a testben; kaumāram – gyermekkor; yauvanam – fiatalság; jarā – öregség; tathā – hasonlóan; deha-antara – a test cseréjének; prāptiḥ – elérés; dhīraḥ – a józan; tatra – azután; na – sohasem; muhyati – megtéved."}, {"Félév": "1", "Kurzusnév": "Bhagavad-gītā 1.", "Vers / forrás": "2.14. VERS", "Versszöveg": "mātrā-sparśās tu kaunteya \nśītoṣṇa-sukha-duḥkha-dāḥ\nāgamāpāyino 'nityās \ntāṁs titikṣasva bhārata", "Magyar fordítás": "Ó, Kuntī fia! A boldogság és a boldogtalanság ideiglenes megjelenése és eltűnése olyan, mint a tél és a nyár kezdete és elmúlása. Ó, Bharata sarja, ezek csak érzékfelfogásból erednek, s az embernek meg kell tanulnia eltűrni őket, anélkül hogy zavarnák őt.", "Szavankénti fordítás": "mātrā-sparśāḥ – érzékfelfogás; tu – csak; kaunteya – ó, Kuntī fia; śīta – tél; uṣṇa – nyár; sukha – boldogság; duḥkha – és fájdalom; dāḥ – adva; āgama – megjelenés; apāyinaḥ – eltűnés; anityāḥ – nem állandó; tān – mindegyik; titikṣasva – próbáld meg eltűrni; bhārata – ó, Bharata-dinasztia leszármazottja."}, {"Félév": "1", "Kurzusnév": "Bhagavad-gītā 1.", "Vers / forrás": "3.37. VERS", "Versszöveg": "śrī-bhagavān uvāca\nkāma eṣa krodha eṣa \nrajo-guṇa-samudbhavaḥ\nmahāśano mahā-pāpmā \nviddhy enam iha vairiṇam", "Magyar fordítás": "Az Istenség Legfelsőbb Személyisége így szól: Csupán a kéjvágy az, ó, Arjuna. A szenvedély anyagi kötőerejével való kapcsolatból születik, s később haraggá alakul át – ez a világ mindent felemésztő, bűnös ellensége.", "Szavankénti fordítás": "śrī-bhagavān uvāca – az Istenség Személyisége mondta; kāmaḥ – kéjvágy; eṣaḥ – ez; krodhaḥ – harag; eṣaḥ – ez; rajaḥ-guṇa – a szenvedély kötőereje; samudbhavaḥ – született; mahā-aśanaḥ – mindent felemésztő; mahā-pāpmā – nagyon bűnös; viddhi – tudd; enam – ezt; iha – az anyagi világban; vairiṇam – a legnagyobb ellenség."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītā 2.", "Vers / forrás": "4.2. VERS", "Versszöveg": "evaṁ paramparā-prāptam \nimaṁ rājarṣayo viduḥ\nsa kāleneha mahatā \nyogo naṣṭaḥ parantapa", "Magyar fordítás": "E legfelsőbb tudomány ily módon, a tanítványi láncon keresztül szállt alá, s a szent királyok így értették meg azt. Idővel azonban megszakadt e lánc, ezért tűnik az eredeti tudomány elveszettnek.", "Szavankénti fordítás": "evam – ily módon; paramparā – a tanítványi lánc által; prāptam – megkapták; imam – ezt a tudományt; rāja-ṛṣayaḥ – a szent királyok; viduḥ – megértették; saḥ – azt a tudást; kālena – idővel; iha – e világban; mahatā – nagy; yogaḥ – a Legfelsőbbel való kapcsolat tudománya; naṣṭaḥ – elveszett; parantapa – ó, Arjuna, ellenség legyőzője."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītā 2.", "Vers / forrás": "6.47. VERS", "Versszöveg": "yoginām api sarveṣāṁ \nmad-gatenāntar-ātmanā\nśraddhāvān bhajate yo māṁ \nsa me yuktatamo mataḥ", "Magyar fordítás": "Aki nagy hittel mindig Bennem lakozik, magában Énrám gondol, s transzcendentális szerető szolgálatot végez Nekem, az a legmeghittebben egyesül Velem a yogában, s minden yogī közül ő a legkiválóbb. Ez az Én véleményem.", "Szavankénti fordítás": "yoginām – a yogīk közül; api – is; sarveṣām – valamennyi közül; mat-gatena – Bennem lakozva, mindig Rám gondolva; antaḥ-ātmanā – magában; śraddhā-vān – teljes hittel; bhajate – transzcendentális szerető szolgálatot végez; yaḥ – aki; mām – Nekem (a Legfelsőbb Úrnak); saḥ – ő; me – Általam; yukta-tamaḥ – a legnagyobb yogī; mataḥ – tekintik."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītā 2.", "Vers / forrás": "7.8. VERS", "Versszöveg": "raso 'ham apsu kaunteya \nprabhāsmi śaśi-sūryayoḥ\npraṇavaḥ sarva-vedeṣu \nśabdaḥ khe pauruṣaṁ nṛṣu", "Magyar fordítás": "Ó, Kuntī fia! Én vagyok a víz íze, a nap és a hold fénye, az oṁ szótag a védikus mantrákban, a hang az éterben és az emberi képesség.", "Szavankénti fordítás": "rasaḥ – íz; aham – Én; apsu – a vízben; kaunteya – ó, Kuntī fia; prabhā – fény; asmi – vagyok; śaśi-sūryayoḥ – a napnak és a holdnak; praṇavaḥ – a három hang: a-u-m; sarva – mindben; vedeṣu – a Védákban; śabdaḥ – hangvibráció; khe – az éterben; pauruṣam – képesség; nṛṣu – az emberben."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītā 3.", "Vers / forrás": "9.26. VERS", "Versszöveg": "patraṁ puṣpaṁ phalaṁ toyaṁ \nyo me bhaktyā prayacchati\ntad ahaṁ bhakty-upahṛtam \naśnāmi prayatātmanaḥ", "Magyar fordítás": "Ha valaki szeretettel és odaadással áldoz Nekem egy levelet, egy virágot, egy gyümölcsöt vagy egy kevés vizet, Én elfogadom azt.", "Szavankénti fordítás": "patram – egy levelet; puṣpam – egy virágot; phalam – egy gyümölcsöt; toyam – vizet; yaḥ – bárki; me – Nekem; bhaktyā – odaadással; prayacchati – felajánl; tat – azt; aham – Én; bhakti-upahṛtam – odaadással ajánlott; aśnāmi – elfogadom; prayata-ātmanaḥ – attól, aki tiszta tudatú."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītā 3.", "Vers / forrás": "10.8. VERS", "Versszöveg": "ahaṁ sarvasya prabhavo \nmattaḥ sarvaṁ pravartate\niti matvā bhajante māṁ \nbudhā bhāva-samanvitāḥ", "Magyar fordítás": "Én vagyok az eredete a lelki és az anyagi világnak, minden Belőlem árad. A bölcsek, akik tudva tudják ezt, odaadóan szolgálnak és teljes szívből imádnak Engem.", "Szavankénti fordítás": "aham – Én; sarvasya – mindennek; prabhavaḥ – származásának forrása; mattaḥ – Tőlem; sarvam – minden; pravartate – árad; iti – így; matvā – tudván; bhajante – odaadóvá válnak; mām – Irántam; budhāḥ – a műveltek; bhāva-samanvitāḥ – nagy figyelemmel."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītā 3.", "Vers / forrás": "18.65. VERS", "Versszöveg": "man-manā bhava mad-bhakto \nmad-yājī māṁ namaskuru\nmām evaiṣyasi satyaṁ te \npratijāne priyo 'si me", "Magyar fordítás": "Gondolj mindig Rám, légy az Én hívem! Imádj Engem, és ajánld tiszteletedet Előttem, s így kétségtelenül el fogsz jutni Hozzám! Ezt megígérem neked, mert nagyon kedves barátom vagy.", "Szavankénti fordítás": "mat-manāḥ – Rám gondolva; bhava – legyél; mat-bhaktaḥ – az Én bhaktám; mat-yājī – az Én imádóm; mām – Nekem; namaskuru – ajánld fel hódolatodat; mām – Nekem; eva – bizonyára; eṣyasi – jönni fogsz; satyam – igazán; te – neked; pratijāne – megígérem; priyaḥ – kedves; asi – vagy; me – Nekem."}, {"Félév": "1", "Kurzusnév": "Bevezetés a védikus szentírásokba", "Vers / forrás": "Viṣṇu-purāṇa 3.6.28", "Versszöveg": "aṅgāni caturo vedā\nmīmāṁsā nyāya-vistaraḥ\npurāṇaṁ dharma-śāstrañ ca\nvidyā hy etāś caturdaśa", "Magyar fordítás": "A négy Véda és a hat aṅga, a mīmāṁsā, valamint a nyāya, a purāṇa és a dharma-śāstra szentíráscsoportok alkotják a tudás tizennégy ágát.", "Szavankénti fordítás": "aṅgāni – részek; caturaḥ – négy; vedāḥ – Védák; mīmāṁsā – mīmāṁsā; nyāya-vistaraḥ – a nyāya részletes rendszere; purāṇam – a purāṇa; dharma-śāstram – a dharma-śāstra; ca – és; vidyāḥ –tudásterületek; hi – bizony; etāḥ – ezek; caturdaśa – tizennégy."}, {"Félév": "5", "Kurzusnév": "Bhakti-raszámrita szindhu - Az odaadás nektárja", "Vers / forrás": "1.1.11. Vers", "Versszöveg": "anyābhilāṣitā-śūnyaṁ \njñāna-karmādy-anāvṛtam\nānukūlyena kṛṣṇānu-\nśīlanaṁ bhaktir uttamā", "Magyar fordítás": "Amikor az elsőrendű odaadó szolgálat kifejlődik, a bhaktának mentesnek kell lennie minden anyagi vágytól, monista filozófián keresztül szerzett tudástól és gyümölcsöző tettől. Mindig kedvezően kell szolgálnia Kṛṣṇát, úgy, ahogy Kṛṣṇa kívánja.", "Szavankénti fordítás": "anya-abhilāṣitā-śūnyam – minden olyan vágytól mentes, amely nem az Úr Kṛṣṇa szolgálatára irányul, azaz mentes az anyagi vágyaktól (mint amilyen a vágy a húsevésre, a törvénytelen nemi életre, a szerencsejátékra és a mámorítószerekhez való ragaszkodásra); jñāna – a monista māyāvādīk filozófiájának ismeretével; karma – gyümölcsöző tettek által; ādi – a természetellenes lemondással, a yoga gépies gyakorlásával, a sāṅkhya filozófia tanulmányozásával stb.; anāvṛtam – nincs befedve; ānukūlyena – kedvező; kṛṣṇa-anuśīlanam – a Kṛṣṇával kapcsolatos szolgálat végzése; bhaktiḥ uttamā – elsőrendű odaadó szolgálat."}, {"Félév": "6", "Kurzusnév": "Upanisadok", "Vers / forrás": "Śrī Īśopaniṣad\nINVOKÁCIÓ", "Versszöveg": "oṁ pūrṇam adaḥ pūrṇam idaṁ\npūrṇāt pūrṇam udacyate\npūrṇasya pūrṇam ādāya\npūrṇam evāvaśiṣyate", "Magyar fordítás": "Az Istenség Személyisége tökéletes és teljes, és mivel maradéktalanul tökéletes, mindabban, ami Belőle kiárad – így ebben a mulandó világban is –, minden megvan ahhoz, hogy hiánytalanul teljes legyen. Bármit hozzon létre a Teljes Egész, az önmagában is teljes. Ő a Teljes Egész, ezért bár számtalan hiánytalan egység árad ki Belőle, megmarad teljes egésznek.", "Szavankénti fordítás": "oṁ – a Teljes Egész; pūrṇam – tökéletesen teljes; adaḥ – az; pūrṇam – tökéletesen teljes; idam – ez az érzékekkel felfogható világ; pūrṇāt – a teljesen tökéletestől; pūrṇam – teljes egység; udacyate – származik; pūrṇasya – a Teljes Egésztől; pūrṇam – mindegyiket, teljesen; ādāya – elvéve; pūrṇam – teljes egyensúly; eva – még akkor is; avaśiṣyate – megmarad."}, {"Félév": "6", "Kurzusnév": "Upanisadok", "Vers / forrás": "Śrī Īśopaniṣad\nELSő MANTRA", "Versszöveg": "īśāvāsyam idaṁ sarvaṁ\nyat kiñca jagatyāṁ jagat\ntena tyaktena bhuñjīthā\nmā gṛdhaḥ kasya svid dhanam", "Magyar fordítás": "A világegyetemen belül az Úr irányít minden élőt és élettelent, s minden az Övé. Az embernek ezért csupán azt szabad elfogadnia, amire szüksége van, s ami őt illeti meg. Minden mástól tartózkodnia kell, jól tudván, hogy az kihez tartozik.", "Szavankénti fordítás": "īśa – az Úr által; āvāsyam – irányított; idam – ez; sarvam – minden; yat kiñca – bármi; jagatyām – az univerzumon belül; jagat – minden élő és élettelen; tena – Általa; tyaktena – kiszabott hányad; bhuñjīthāḥ – el kell fogadnod; mā – ne; gṛdhaḥ – igyekezz megszerezni; kasya svid – senki másnak; dhanam – a kincsét."}, {"Félév": "3", "Kurzusnév": "Jóga-szútra 1", "Vers / forrás": "1. sūtra", "Versszöveg": "atha yogānuśāsanam", "Magyar fordítás": "Most következzék a yoga tanításainak előző korok hagyományai alapján történő magyarázata.", "Szavankénti fordítás": "atha – most; yoga – összekapcsolódás, kapcsolat, egyesülés, rögzítés, igába vonás, [a hagyományban: összekapcsolódás minden létező forrásával, az önmegvalósítás szent művészete]; anu – valami szerint; śāsanam – magyarázat (anuśāsanam – tanítás a szent hagyományok alapján)."}, {"Félév": "3", "Kurzusnév": "Jóga-szútra 1", "Vers / forrás": "2. sūtra", "Versszöveg": "yogaś citta-vṛtti-nirodhaḥ", "Magyar fordítás": "A yoga [az a folyamat amely] az anyagi tudat [anyagi jellegű] működéseinek leállításá[ra irányul].", "Szavankénti fordítás": "yogaḥ – yoga; citta – anyagi tudat; vṛtti – mozgás, folyamat; nirodhaḥ – leállítás, megszüntetés."}, {"Félév": "3", "Kurzusnév": "Jóga-szútra 1", "Vers / forrás": "3. sūtra", "Versszöveg": "tadā draṣṭuḥ svarūpe 'vasthānam", "Magyar fordítás": "[Ha ez megtörtént] akkor a Látó (az egyéni lélek) saját [eredeti] formájában helyezkedik el.", "Szavankénti fordítás": "tadā – akkor (a 2. sūtrában megtörténtek után); draṣṭuḥ – a látóé [a yogában: a transzcendentális léleké (puruṣa), aki az érzékelés valódi alanya]; sva – saját; rūpe – formában; avasthānam – elhelyezkedés."}, {"Félév": "3", "Kurzusnév": "Jóga-szútra 1", "Vers / forrás": "4. sūtra", "Versszöveg": "vṛtti-sārūpyam itaratra", "Magyar fordítás": "Más esetben [a lélek] az anyagi tudat tevékenységeivel azonosul. ", "Szavankénti fordítás": "vṛtti – mozgás [a yogában: citta-vṛtti – az anyagi tudat állapotai, illetve azok sajátos változásai]; sārūpyam – hasonulás [vṛtti-sārūpyam – az anyagi tudat állapotaival való azonosulás]; itaratra – máskor."}, {"Félév": "2", "Kurzusnév": "Hinduizmus társadalomfilozófiája", "Vers / forrás": "Bhg. 4.13. VERS", "Versszöveg": "cātur-varṇyaṁ mayā sṛṣṭaṁ\nguṇa-karma-vibhāgaśaḥ\ntasya kartāram api māṁ\nviddhy akartāram avyayam", "Magyar fordítás": "Az emberi társadalom négy osztályát Én teremtettem az anyagi természet három kötőereje és a rájuk jellemző munka szerint. Tudd meg, hogy bár Én vagyok e rendszer alkotója, Én mégis nem-cselekvő és változatlan vagyok!", "Szavankénti fordítás": "cātuḥ-varṇyam – az emberi társadalom négy rétege; mayā – Általam; sṛṣṭam – teremtett; guṇa – a tulajdonság; karma – és a munka; vibhāgaśaḥ – felosztása szerint; tasya – annak; kartāram – atyja; api – habár; mām – Én; viddhi – tudd hát; akartāram – nem cselekvőként; avyayam – változatlan."}, {"Félév": "4", "Kurzusnév": "Guru-tattva", "Vers / forrás": "Śrī Guru-praṇāma", "Versszöveg": "oṁ ajñāna-timirāndhasya\njñānāñjana-śalākayā\ncakṣur unmīlitaṁ yena\ntasmai śrī-gurave namaḥ", "Magyar fordítás": "A legsötétebb tudatlanságban születtem, de lelki tanítómesterem a tudás fáklyalángjával felnyitotta szememet. Tiszteletteljes hódolatomat ajánlom neki.", "Szavankénti fordítás": "oṁ – megszólítás; ajñāna – tudatlanságé; timira – a sötétségtől; andhasya – azé, aki megvakult; jñāna-añjana – a lelki tudás balzsamával; śalākayā – a śalākā nevű eszközzel, amelyet a hályogos szem bekenéséhez használnak; cakṣuḥ – szemek; unmīlitam – felnyitották ; yena – aki által; tasmai – őneki; śrī-gurave – lelki tanítómesteremnek; namaḥ – hódolatom."}, {"Félév": "4", "Kurzusnév": "Guru-tattva", "Vers / forrás": "Bhg.4.2. VERS", "Versszöveg": "evaṁ paramparā-prāptam \nimaṁ rājarṣayo viduḥ\nsa kāleneha mahatā \nyogo naṣṭaḥ parantapa", "Magyar fordítás": "E legfelsőbb tudomány ily módon, a tanítványi láncon keresztül szállt alá, s a szent királyok így értették meg azt. Idővel azonban megszakadt e lánc, ezért tűnik az eredeti tudomány elveszettnek.", "Szavankénti fordítás": "evam – ily módon; paramparā – a tanítványi lánc által; prāptam – megkapták; imam – ezt a tudományt; rāja-ṛṣayaḥ – a szent királyok; viduḥ – megértették; saḥ – azt a tudást; kālena – idővel; iha – e világban; mahatā – nagy; yogaḥ – a Legfelsőbbel való kapcsolat tudománya; naṣṭaḥ – elveszett; parantapa – ó, Arjuna, ellenség legyőzője."}, {"Félév": "4", "Kurzusnév": "Guru-tattva", "Vers / forrás": "Bhg. 4.34. VERS", "Versszöveg": "tad viddhi praṇipātena \nparipraśnena sevayā\nupadekṣyanti te jñānaṁ \njñāninas tattva-darśinaḥ", "Magyar fordítás": "Fordulj egy lelki tanítómesterhez, úgy próbáld megismerni az igazságot! Tudakozódj tőle alázatosan, és szolgáld őt! Az önmegvalósult lelkek képesek tudásban részesíteni téged, mert ők már látták az igazságot.", "Szavankénti fordítás": "tat – azt az ismeretet a különféle áldozatokról; viddhi – próbáld megérteni; praṇipātena – azál-tal, hogy egy lelki tanítómesterhez fordulsz; paripraśnena – alázatos tudakozódással; sevayā – szolgálatot végezve; upadekṣyanti – be fognak avatni; te – téged; jñānam – tudásba; jñāninaḥ – az önmegvalósítottak; tattva – az igazságnak; darśinaḥ – látnokai."}, {"Félév": "5", "Kurzusnév": "Visnu-szahaszra-náma meditáció", "Vers / forrás": "ELSŐ Vers", "Versszöveg": "oṁ namo bhagavate vāsudevāya\nviśvaṁ viṣṇur vaśatkāro\nbhūta-bhavya-bhavat-prabhuḥ\nbhūta-kṛd bhūta-bhṛd bhāvo\nbhūtātmā bhūta-bhāvanaḥ", "Magyar fordítás": "Az Úr Viṣṇu maga az univerzum, s teljes minden tekintetben. Ő az, aki körülvesz mindent, s mindent áthat, ellenőriz és irányít. Ő minden múltban, jelenben és jövőben létező Ura, minden élőlény alkotója, és támasza, aki mindig független bármi mástól, Ő az élőlények élete és lelke, aki fenntart, és gondoz mindent, amit teremtett.", "Szavankénti fordítás": "oṁ – megszólítás; namo – hódolat; bhagavate – az Istenség Legfelsőbb Személyiségének; vāsudevāya – Vāsudevának; viśvam – az univerzum, teljes minden tekintetben; viṣṇuḥ – aki mindent áthat és mindenhol jelen van; vaśatkāraḥ – aki ellenőriz és irányít; bhūta – a múltban létezők; bhavya – a jövőben létezők; bhavat – a jelenben létezők; prabhuḥ – ura; bhūta-kṛt – minden élőlény alkotója; bhūta-bhṛt – minden élőlény támasza; bhāvaḥ – aki önmagában létezik, minden mástól függetlenül; bhūta-ātmā – az élőlények lelke, élete; bhūta-bhāvanaḥ – minden élőlény fenntartója és fejlődésének elősegítője."}, {"Félév": "5", "Kurzusnév": "Visnu-szahaszra-náma meditáció", "Vers / forrás": "MÁSODIK Vers", "Versszöveg": "pūtātmā paramātmā ca\nmuktānāṁ paramā gatiḥ\navyayaḥ puruṣaḥ sākṣī\nkṣetrajño 'kṣara eva ca", "Magyar fordítás": "A Legfelsőbb Úr tiszta lélek, aki számára nincs más irányító. Ő az, aki valamennyi felszabadult léleknek a legvégső célja, aki elpusztíthatatlan, és aki már akkor létezett, mikor minden más létrejött. Ő a mindent-ismerő, aki ismeri minden élőlény testét és elméjét, és kinek nagysága nem csökken az idő múlásával annak ellenére sem, hogy a felszabadult lelkek folyamatosan transzcendentális természetének élvezetébe merülnek el.", "Szavankénti fordítás": "pūtātmā – tiszta lélek; paramātmā – a Legfelsőbb Lélek; ca – és; muktānām – a felszabadult lelkeknek; paramā – legvégső; gatiḥ – célja; avyayaḥ – elpusztíthatatlan; puruṣaḥ – az eredeti személy; sākṣī – a mindent ismerő tanú; kṣetrajñaḥ – aki ismeri minden élőlény testét és elméjét; akṣaraḥ – akinek nagysága nem csökken; eva – bizony; ca – és."}, {"Félév": "5", "Kurzusnév": "Visnu-szahaszra-náma meditáció", "Vers / forrás": "HARMADIK Vers", "Versszöveg": "yogo yoga-vidāṁ netā\npradhāna-puruṣeśvaraḥ\nnarasiṁha-vapuḥ śrīmān\nkeśavaḥ puruṣottamaḥ", "Magyar fordítás": "A Legfelsőbb Úr az, aki az egyedüli, határozott és akadálytalan megváltást jelenti, és aki addig vezeti a yogát gyakorlókat, amíg el nem érik céljukat. Ő az elsődleges anyagnak és valamennyi élőlénynek az Ura, aki egy ember-oroszlán formában is megnyilvánul, s akinek szép alakja, és gyönyörű hajfürtjei vannak. Ő a Legfelsőbb a transzcendentális egyéni lelkek között.", "Szavankénti fordítás": "yogaḥ – az egyedüli, határozott és akadálytalan megváltás; yoga-vidām – a yoga ismerőinek; netā – vezetője; pradhāna – az elsődleges anyagnak; puruṣa – az élőlényeknek; īśvaraḥ – Ura; narasiṁha-vapuḥ – ember-oroszlán formával rendelkező; śrīmān – szép alakú; keśavaḥ – gyönyörű hajfürtökkel rendelkező; puruṣottamaḥ – a Legfelsőbb a transzcendentális lelkek között."}, {"Félév": "5", "Kurzusnév": "Visnu-szahaszra-náma meditáció", "Vers / forrás": "NEGYEDIK Vers", "Versszöveg": "sarvaḥ śarvaḥ śivaḥ sthānur\nbhūtādir nidhir avyayaḥ\nsaṁbhavo bhāvano bhartā\nprabhavaḥ prabhur īśvaraḥ", "Magyar fordítás": "A Legfelsőbb Úr minden. Ő az, aki minden bűnt elpusztít, aki minden tekintetben kedvező, s szilárdan áll a helyzetében. Ő a forrása az élőlényeknek, az elpusztíthatatlan kincs, aki bárhol, bármikor képes megjelenni saját akaratából. Ő a bhaktáinak a jóakarója, fenntartója, s Ő a végső, az eredet. Ő a legfelsőbb mester, az élőlények legfelsőbb irányítója. ", "Szavankénti fordítás": "sarvaḥ – minden; śarvaḥ – aki minden bűnt elpusztít; śivaḥ – minden tekintetben kedvező; sthānuḥ – aki szilárdan áll a helyzetében; bhūta-ādiḥ – az élőlények forrása; nidhiḥ – kincs; avyayaḥ – elpusztíthatatlan; saṁbhavaḥ – aki bárhol, bármikor képes megjelenni saját akaratából; bhāvanaḥ – a bhaktái jóakarója; bhartā – fenntartója; prabhavaḥ – a végső, az eredet; prabhuḥ – a legfelsőbb mester; īśvaraḥ – az élőlények legfelsőbb irányítója."}, {"Félév": "5", "Kurzusnév": "Visnu-szahaszra-náma meditáció", "Vers / forrás": "ÖTÖDIK Vers", "Versszöveg": "svayambhūḥ śambhur ādityaḥ\npuṣkarākṣo mahāsvanaḥ\nanādi-nidhano dhātā\nvidhātā dhatur uttamaḥ", "Magyar fordítás": "A Legfelsőbb Úr saját szabad akaratából megnyilvánítja meg magát. Ő az, aki boldogságot okoz mindenkinek a szépsége által. Ő az, ki fenntart és táplál mindent, mint a Nap, a Lótusz-szemű, a Védák tiszteletre méltó hangja, aki kezdet és vég nélkül való. Ő a teremtő, és létrehozó, aki messze felülmúlja Brahmāt a legfőbb félistent.", "Szavankénti fordítás": "svayambhūḥ – aki saját szabad akaratából megnyilvánítja magát; śambhuḥ – aki boldogságot okoz mindenkinek a szépsége által; ādityaḥ – aki fenntart és táplál mindent, mint a Nap; puṣkarākṣaḥ – lótusz-szemű; mahā-svanaḥ – a Védák tiszteletre méltó hangja; anādi-nidhanaḥ – aki kezdet és vég nélküli; dhātā – teremtő; vidhātā – létrehozó; dhātuḥ uttamaḥ – aki messze felülmúlja Brahmāt."}, {"Félév": "6", "Kurzusnév": "Brahma-szamhitá meditáció", "Vers / forrás": "29. vers", "Versszöveg": "cintāmaṇi-prakara-sadmasu kalpa-vṛkṣa-\nlakṣāvṛteṣu surabhīr abhipālayantam \nlakṣmī-sahasra-śata-sambhrama-sevyamānaṁ\ngovindam ādi-puruṣaṁ tam ahaṁ bhajāmi", "Magyar fordítás": "Govindát imádom, az elsődleges Urat, az első és eredeti teremtőt, aki surabhī teheneket legeltet, s akit kívánságteljesítő fák milliói által körülölelt lelki drágakövekből épült hajlékain Laksmīk vagy gopīk százezrei szolgálnak szüntelenül, nagy tisztelettel és ragaszkodással.", "Szavankénti fordítás": "cintāmaṇi – lelki drágakövekből; prakara –  épült; sadmasu – hajlékokban; kalpa-vṛkṣa – kívánságteljesítő fa; lakṣa – százezer; āvṛteṣu – körülvett; surabhīḥ – surabhī teheneket;              abhipālayantam – gondozót, legeltetőt; lakṣmī – Lakṣmīkat, szerencseistennőket; sahasra – ezer; śata – száz; sambhrama – nagy tisztelet; sevyamānam – szolgálatban részesülőt; govindam – Govindát; ādi-puruṣam – az erede-ti személyt, az elsődleges Urat; tam – Őt; aham – én; bhajāmi – szolgálom."}, {"Félév": "6", "Kurzusnév": "Brahma-szamhitá meditáció", "Vers / forrás": "30. vers", "Versszöveg": "veṇuṁ kvaṇantam aravinda-dalāyatākṣaṁ\nbarhāvataṁsam asitāmbuda-sundarāṅgam\nkandarpa-koṭi-kamanīya-viśeṣa-śobhaṁ\ngovindam ādi-puruṣaṁ tam ahaṁ bhajāmi", "Magyar fordítás": "Govindát imádom, az elsődleges Urat, aki gyönyörűen fuvolázik, akinek a szemei a nyíló lótuszvirág szirmaihoz hasonlatosak, kinek fejét pávatoll díszíti, és akinek csodálatos alakja a sötétkék esőfelhők színárnyalatában ragyog. Egyedülálló bája és szeretetreméltósága Kupidók millióit elbűvöli.", "Szavankénti fordítás": "veṇum – fuvolát; kvaṇantam – megszólaltatót; aravinda – lótusz; dala – szirom; āyata – hosszúkás, kiterjedt; akṣam – szeműt; barha – pávatoll; avataṁsam – díszként viselőt; asita – sötét; ambuda – esőfelhő; sundara – gyönyörű; aṅgam – testűt, alakút; kandarpa – Kupidó; koṭi – tízmillió; kamanīya – elbűvölő; viśeṣa – egyedülálló; śobham – szépséggel, ragyogással rendelkezőt; govindam – Govindát; ādi-puruṣam – az eredeti személyt, az elsődleges Urat; tam – Őt; aham – én; bhajāmi – imádom, szolgálom."}, {"Félév": "6", "Kurzusnév": "Brahma-szamhitá meditáció", "Vers / forrás": "31. vers", "Versszöveg": "ālola-candraka-lasad-vanamālya-vaṁśī\nratnāṅgadaṁ praṇaya-keli-kalā-vilāsam\nśyāmaṁ tri-bhaṅga-lalitaṁ niyata-prakāśam\ngovindam ādi-puruṣaṁ tam ahaṁ bhajāmi", "Magyar fordítás": "Govindát imádom, az elsődleges Urat, kinek nyakában egy hold alakú medalionnal ékesített, s erdei virágokból készült füzér lengedez. Két kezét fuvolája és drágakövekkel kirakott ékszerei díszítik, s mindig szeretetteljes kedvteléseiben merül el. Elragadó, három helyen meghajló Syāmasundara formája örökké létezik.", "Szavankénti fordítás": "ālola – lengő; candraka – hold alakú dísz; lasat – ragyogó; vanamālya – erdei virágfüzér; vaṁśī – fuvola; ratna – drágakő; aṅgadam – karperecet; praṇaya – bensőséges szeretet; keli – kedvtelés; kalā – művészet; vilāsam – gyönyörteli megnyilvánulásokkal rendelkezőt; śyāmam – sötétkék színűt, Śyāmasundarát; tri-bhaṅga – három helyen meghajló; lalitam – kecseset; niyata – örök, állandó; prakāśam – megnyilvánulást; govindam – Govindát; ādi-puruṣam – az eredeti személyt, az elsődleges Urat; tam – Őt; aham – én; bhajāmi – imádom, szolgálom."}, {"Félév": "6", "Kurzusnév": "Brahma-szamhitá meditáció", "Vers / forrás": "32. vers", "Versszöveg": "aṅgāni yasya sakalendriya-vṛttimanti \npaśyanti pānti kalayanti ciraṁ jaganti \nānanda-cinmaya-sad-ujjvala-vigrahasya\ngovindam ādi-puruṣaṁ tam ahaṁ bhajāmi", "Magyar fordítás": "Govindát imádom, az elsődleges Urat, akinek transzcendentális alakja boldogsággal, igazsággal és valódi (örök) létezéssel teli, s amely tündöklően ragyog. Testének minden része önmagában hordozza valamennyi érzékszerv összes képességét. Ő az, aki örökké látja, fenntartja és irányítja az anyagi és lelki univerzumok végtelen sokaságát.", "Szavankénti fordítás": "aṅgāni – testrészek; yasya – akinek; sakala – összes; indriya – érzékszerv; vṛttimanti – működéssel rendelkező; paśyanti – látnak; pānti – fenntartanak; kalayanti – irányítanak; ciram – örökké; jaganti – világokat, univerzumokat; ānanda – boldogság; cinmaya – lelki tudással teljes; sat – örök létezés; ujjvala – ragyogó, tündöklő; vigrahasya – alakjának; govindam – Govindát; ādi-puruṣam – az eredeti személyt, az elsődleges Urat; tam – Őt; aham – én; bhajāmi – imádom, szolgálom."}, {"Félév": "6", "Kurzusnév": "Brahma-szamhitá meditáció", "Vers / forrás": "33. vers", "Versszöveg": "advaitam acyutam anādim ananta-rūpam\nādyaṁ purāṇa-puruṣaṁ nava-yauvanaṁ ca \nvedeṣu durlabham adurlabham ātma-bhaktau\ngovindam ādi-puruṣaṁ tam ahaṁ bhajāmi", "Magyar fordítás": "Govindát imádom, az elsődleges Urat, aki megközelíthetetlen pusztán a Védák tanulmányozásán keresztül, viszont aki könnyen elérhetővé válik a lélek tiszta és vegyítetlen odaadása által. Ő az, akiből nincsen második, aki nincs alávetve a pusztulásnak, s akinek transzcendentális formája végtelen. Ő a kezdet, az ősidőktől fogva létező örök puruṣa, aki mégis a bimbózó ifjúság virágot bontó szépségével rendelkezik", "Szavankénti fordítás": "advaitam – második nélküli egyetlent; acyutam – tévedhetetlent; anādim – kezdet nélkülit; ananta-rūpam – végtelen formájút; ādyam – eredetit; purāṇa-puruṣam – ősi személyt, örök puruṣát; nava-yauvanam – örökké friss ifjúsággal rendelkezőt; ca – és; vedeṣu – a Védákban; durlabham – nehezen elérhetőt, megközelíthetetlent; adurlabham – könnyen elérhetőt; ātma-bhaktau – a lélek odaadásában, tiszta önátadásban; govindam – Govindát; ādi-puruṣam – az eredeti személyt, az elsődleges Urat; tam – Őt; aham – én; bhajāmi – imádom, szolgálom."}, {"Félév": "5", "Kurzusnév": "Upadésámrita - A tanítások nektárja", "Vers / forrás": "1", "Versszöveg": "vāco vegaṁ manasaḥ krodha-vegaṁ\njihvā-vegam udaropastha-vegam\netān vegān yo viṣaheta dhīraḥ\nsarvām apīmāṁ pṛthivīṁ sa śiṣyāt", "Magyar fordítás": "Az a józan ember, aki ellen tud állni a beszéd késztetésének, az elme ösztönzésének, a düh tetteinek, valamint a nyelv, a gyomor és a nemi szervek késztetésének, alkalmas arra, hogy tanítványokat fogadjon el az egész világon.", "Szavankénti fordítás": "vācaḥ – a beszédnek; vegam – az ösztönzését; manasaḥ – az elmének; krodha – a dühnek; vegam – az ösztönzését; jihvā – a nyelvnek; vegam – az ösztönzését; udara-upastha – a gyomornak és a nemi szerveknek; vegam – az ösztönzését; etān – ezeket; vegān – az ösztönzéseket; yaḥ – bárki, aki; viṣaheta – el tudja tűrni; dhīraḥ – józan; sarvām – az egész; api – bizonyosan; imām – ezen; pṛthivīm – a világon; saḥ – az ilyen személy; śiṣyāt – tanítványokat fogadhat el.\n"}, {"Félév": "5", "Kurzusnév": "Upadésámrita - A tanítások nektárja", "Vers / forrás": "2", "Versszöveg": "atyāhāraḥ prayāsaś ca\nprajalpo niyamāgrahaḥ\njana-saṅgaś ca laulyaṁ ca\nṣaḍbhir bhaktir vinaśyati", "Magyar fordítás": "Az ember odaadó szolgálata megsemmisül, ha túlságosan belebonyolódik a következő hat cselekedetbe: 1. a szükségesnél több evés, vagy a szükségesnél több anyagi dolog felhalmozása; 2. túlzott igyekezet nehezen megszerezhető anyagi dolgok eléréséért; 3. haszontalan beszéd világi témákról; 4. az írások szabályozó elveinek betartása pusztán a szabályozott élet, nem pedig a lelki fejlődés kedvéért; vagy: az írások szabályozó elveinek elvetése és a tőlük független, önkényes cselekvés; 5. olyan világi gondolkodású emberek társaságának keresése, akiket nem érdekel a Kṛṣṇa-tudat; 6. mohó vágy anyagi eredményekre.", "Szavankénti fordítás": "ati-āhāraḥ – túl sok evés, vagy túl sok dolog felhalmozása; prayāsaḥ – túlzott erőfeszítés; ca – és; prajalpaḥ – haszontalan beszéd; niyama – szabályozó elvek; āgrahaḥ – túlzott ragaszkodás (vagy agrahaḥ – túlzott elhanyagolás); jana-saṅgaḥ – világi gondolkodású emberek társaságának keresése; ca – és; laulyam – heves vágyódás vagy mohóság; ca – és; ṣaḍbhiḥ – e hat miatt; bhaktiḥ – odaadó szolgálat; vinaśyati – elpusztul.\n"}, {"Félév": "5", "Kurzusnév": "Upadésámrita - A tanítások nektárja", "Vers / forrás": "3", "Versszöveg": "utsāhān niścayād dhairyāt\ntat-tat-karma-pravartanāt\nsaṅga-tyāgāt sato vṛtteḥ\nṣaḍbhir bhaktiḥ prasidhyati", "Magyar fordítás": "A tiszta odaadó szolgálat végzését hat alapelv követése befolyásolja kedvezően: 1. lelkesedés; 2. bizalommal teli törekvés; 3. türelem; 4. a szabályozó elvek szerinti cselekvés [például śravaṇaṁ kīrtanaṁ viṣṇoḥ smaraṇam – hallás és éneklés Kṛṣṇáról, emlékezés Kṛṣṇára]; 5. az abhakták társaságának kerülése; 6. az előző ācāryák nyomdokainak követése. Ennek a hat vezérelvnek a követése minden kétséget kizáróan biztosítja a tiszta odaadó szolgálat teljes sikerét.", "Szavankénti fordítás": "utsāhāt – lelkesedéssel; niścayāt – bizalommal; dhairyāt – türelemmel; tat-tat-karma – az odaadó szolgálatnak kedvező különféle tettek; pravartanāt – végzése által; saṅga-tyāgāt – az abhakták társaságának elkerülésével; sataḥ – a volt nagy ācāryák; vṛtteḥ – lábnyomainak követésével; ṣaḍbhiḥ – ezzel a hattal; bhaktiḥ – odaadó szolgálat; prasidhyati – fejlődik vagy sikeressé válik.\n"}, {"Félév": "5", "Kurzusnév": "Upadésámrita - A tanítások nektárja", "Vers / forrás": "4", "Versszöveg": "dadāti pratigṛhṇāti\nguhyam ākhyāti pṛcchati\nbhuṅkte bhojayate caiva\nṣaḍ-vidhaṁ prīti-lakṣaṇam", "Magyar fordítás": "Adományozás, adományok elfogadása, az elme bizalmas feltárása, bizalmas érdeklődés, prasāda elfogadása és felajánlása – ez a bhakták közötti szeretet hat jele.", "Szavankénti fordítás": "dadāti – adományt ad; pratigṛhṇāti – viszonzásul elfogad; guhyam – bensőséges témákat; ākhyāti – elmagyaráz; pṛcchati – érdeklődik; bhuṅkte – eszik; bhojayate – etet; ca – szintén; eva – bizonyosan; ṣaṭ-vidham – hatféle; prīti – a szeretetnek; lakṣaṇam – jelei."}], "Teológia": [{"Félév": "1", "Kurzusnév": "Bhagavad-gītá 1.", "Vers / forrás": "2.13. VERS", "Versszöveg": "dehino 'smin yathā dehe \nkaumāraṁ yauvanaṁ jarā\ntathā dehāntara-prāptir \ndhīras tatra na muhyati", "Magyar fordítás": "Amint a megtestesült lélek állandóan vándorol ebben a testben a gyermekkortól a serdülőkoron át az öregkorig, a halál pillanatában is egy másik testbe költözik. A józan embert azonban nem téveszti meg az efféle változás.", "Szavankénti fordítás": "dehinaḥ – a megtestesültnek; asmin – ebben; yathā – mint; dehe – a testben; kaumāram – gyermekkor; yauvanam – fiatalság; jarā – öregség; tathā – hasonlóan; deha-antara – a test cseréjének; prāptiḥ – elérés; dhīraḥ – a józan; tatra – azután; na – sohasem; muhyati – megtéved."}, {"Félév": "1", "Kurzusnév": "Bhagavad-gītá 1.", "Vers / forrás": "2.14. VERS", "Versszöveg": "mātrā-sparśās tu kaunteya \nśītoṣṇa-sukha-duḥkha-dāḥ\nāgamāpāyino 'nityās \ntāṁs titikṣasva bhārata", "Magyar fordítás": "Ó, Kuntī fia! A boldogság és a boldogtalanság ideiglenes megjelenése és eltűnése olyan, mint a tél és a nyár kezdete és elmúlása. Ó, Bharata sarja, ezek csak érzékfelfogásból erednek, s az embernek meg kell tanulnia eltűrni őket, anélkül hogy zavarnák őt.", "Szavankénti fordítás": "mātrā-sparśāḥ – érzékfelfogás; tu – csak; kaunteya – ó, Kuntī fia; śīta – tél; uṣṇa – nyár; sukha – boldogság; duḥkha – és fájdalom; dāḥ – adva; āgama – megjelenés; apāyinaḥ – eltűnés; anityāḥ – nem állandó; tān – mindegyik; titikṣasva – próbáld meg eltűrni; bhārata – ó, Bharata-dinasztia leszármazottja."}, {"Félév": "1", "Kurzusnév": "Bhagavad-gītá 1.", "Vers / forrás": "2.20. VERS", "Versszöveg": "na jāyate mriyate vā kadācin\nnāyaṁ bhūtvā bhavitā vā na bhūyaḥ\najo nityaḥ śāśvato 'yaṁ purāṇo\nna hanyate hanyamāne śarīre", "Magyar fordítás": "A lélek nem ismer sem születést, sem halált. Soha nem keletkezett, nem most jön létre, és a jövőben sem fog megszületni. Születetlen, örökkévaló, mindig létező és ősi, s ha a testet meg is ölik, ő akkor sem pusztul el.", "Szavankénti fordítás": "na – soha; jāyate – születik; mriyate – meghal; vā – vagy; kadācit – mindenkor (a múltban, a jelenben és a jövőben); na – sohasem; ayam – ez; bhūtvā – létrejött; bhavitā – létre fog jönni; vā – vagy; na – nem; bhūyaḥ – vagy újra létrejön; ajaḥ – megszületetlen; nityaḥ – örökkévaló; śāśvataḥ – maradandó; ayam – ezt; purāṇaḥ – a legöregebb; na – sohasem; hanyate – megölik; hanyamāne – meggyilkolva; śarīre – a test."}, {"Félév": "1", "Kurzusnév": "Bhagavad-gītá 1.", "Vers / forrás": "3.19. VERS", "Versszöveg": "tasmād asaktaḥ satataṁ \nkāryaṁ karma samācara\nasakto hy ācaran karma \nparam āpnoti pūruṣaḥ", "Magyar fordítás": "Ezért az embernek kötelességből kell cselekednie, anélkül hogy tettei gyümölcseire vágyna, mert aki vonzódás nélkül cselekszik, az eléri a Legfelsőbbet.", "Szavankénti fordítás": "tasmāt – ezért; asaktaḥ – ragaszkodás nélkül; satatam – örökké; kāryam – kötelességként; karma – munka; samācara – hajtsd végre; asaktaḥ – ragaszkodás nélküli; hi – bizonyára; ācaran – végezvén; karma – munka; param – a Legfelsőbbet; āpnoti – eléri; pūruṣaḥ – egy ember."}, {"Félév": "1", "Kurzusnév": "Bhagavad-gītá 1.", "Vers / forrás": "3.37. VERS", "Versszöveg": "śrī-bhagavān uvāca\nkāma eṣa krodha eṣa \nrajo-guṇa-samudbhavaḥ\nmahāśano mahā-pāpmā \nviddhy enam iha vairiṇam", "Magyar fordítás": "Az Istenség Legfelsőbb Személyisége így szól: Csupán a kéjvágy az, ó, Arjuna. A szenvedély anyagi kötőerejével való kapcsolatból születik, s később haraggá alakul át – ez a világ mindent felemésztő, bűnös ellensége.", "Szavankénti fordítás": "śrī-bhagavān uvāca – az Istenség Személyisége mondta; kāmaḥ – kéjvágy; eṣaḥ – ez; krodhaḥ – harag; eṣaḥ – ez; rajaḥ-guṇa – a szenvedély kötőereje; samudbhavaḥ – született; mahā-aśanaḥ – mindent felemésztő; mahā-pāpmā – nagyon bűnös; viddhi – tudd; enam – ezt; iha – az anyagi világban; vairiṇam – a legnagyobb ellenség."}, {"Félév": "1", "Kurzusnév": "Bhagavad-gītá 1.", "Vers / forrás": "4.2. VERS", "Versszöveg": "evaṁ paramparā-prāptam \nimaṁ rājarṣayo viduḥ\nsa kāleneha mahatā \nyogo naṣṭaḥ parantapa", "Magyar fordítás": "E legfelsőbb tudomány ily módon, a tanítványi láncon keresztül szállt alá, s a szent királyok így értették meg azt. Idővel azonban megszakadt e lánc, ezért tűnik az eredeti tudomány elveszettnek.", "Szavankénti fordítás": "evam – ily módon; paramparā – a tanítványi lánc által; prāptam – megkapták; imam – ezt a tudományt; rāja-ṛṣayaḥ – a szent királyok; viduḥ – megértették; saḥ – azt a tudást; kālena – idővel; iha – e világban; mahatā – nagy; yogaḥ – a Legfelsőbbel való kapcsolat tudománya; naṣṭaḥ – elveszett; parantapa – ó, Arjuna, ellenség legyőzője."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītá 2.", "Vers / forrás": "4.7. VERS", "Versszöveg": "yadā yadā hi dharmasya \nglānir bhavati bhārata\nabhyutthānam adharmasya \ntadātmānaṁ sṛjāmy aham", "Magyar fordítás": "Ó, Bharata leszármazottja! Bárhol legyen a vallás gyakorlása hanyatlóban, s kerüljön fölényes túlsúlyba a vallástalanság, alászállok Én Magam.", "Szavankénti fordítás": "yadā yadā – bármikor és bárhol; hi – bizonyára; dharmasya – a vallásnak; glāniḥ – eltérések; bhavati – megnyilvánulnak; bhārata – ó, Bharata leszármazottja; abhyutthānam – túlsúly; adharmasya – a vallástalanságnak; tadā – akkor; ātmānam – önvaló; sṛjāmi – megnyilvánulok; aham – Én."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītá 2.", "Vers / forrás": "4.34. VERS", "Versszöveg": "tad viddhi praṇipātena \nparipraśnena sevayā\nupadekṣyanti te jñānaṁ \njñāninas tattva-darśinaḥ", "Magyar fordítás": "Fordulj egy lelki tanítómesterhez, úgy próbáld megismerni az igazságot! Tudakozódj tőle alázatosan, és szolgáld őt! Az önmegvalósult lelkek képesek tudásban részesíteni téged, mert ők már látták az igazságot.", "Szavankénti fordítás": "tat – azt az ismeretet a különféle áldozatokról; viddhi – próbáld megérteni; praṇipātena – azáltal, hogy egy lelki tanítómesterhez fordulsz; paripraśnena – alázatos tudakozódással; sevayā – szolgálatot végezve; upadekṣyanti – be fognak avatni; te – téged; jñānam – tudásba; jñāninaḥ – az önmegvalósítottak; tattva – az igazságnak; darśinaḥ – látnokai."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītá 2.", "Vers / forrás": "5.18. VERS", "Versszöveg": "vidyā-vinaya-sampanne \nbrāhmaṇe gavi hastini\nśuni caiva śva-pāke ca \npaṇḍitāḥ sama-darśinaḥ", "Magyar fordítás": "Az alázatos bölcsek igaz tudásuk révén ugyanúgy tekintenek a tanult és szelíd brāhmaṇára, a tehénre, az elefántra, a kutyára és a kutyaevőre [a kaszton kívülit] is.", "Szavankénti fordítás": "vidyā – műveltséggel; vinaya – és kedvességgel; sampanne – teljes mértékben rendelkező; brāhmaṇe – a brāhmaṇában; gavi – a tehénben; hastini – az elefántban; śuni – a kutyában; ca – és; eva – bizonyára; śva-pāke – a kutyaevőben (a kaszton kívüliben); ca – külön-külön; paṇḍitāḥ – akik bölcsek; sama-darśinaḥ – akik egyenlőnek látják."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītá 2.", "Vers / forrás": "6.47. VERS", "Versszöveg": "yoginām api sarveṣāṁ \nmad-gatenāntar-ātmanā\nśraddhāvān bhajate yo māṁ \nsa me yuktatamo mataḥ", "Magyar fordítás": "Aki nagy hittel mindig Bennem lakozik, magában Énrám gondol, s transzcendentális szerető szolgálatot végez Nekem, az a legmeghittebben egyesül Velem a yogában, s minden yogī közül ő a legkiválóbb. Ez az Én véleményem.", "Szavankénti fordítás": "yoginām – a yogīk közül; api – is; sarveṣām – valamennyi közül; mat-gatena – Bennem lakozva, mindig Rám gondolva; antaḥ-ātmanā – magában; śraddhā-vān – teljes hittel; bhajate – transzcendentális szerető szolgálatot végez; yaḥ – aki; mām – Nekem (a Legfelsőbb Úrnak); saḥ – ő; me – Általam; yukta-tamaḥ – a legnagyobb yogī; mataḥ – tekintik."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītá 2.", "Vers / forrás": "7.8. VERS", "Versszöveg": "raso 'ham apsu kaunteya \nprabhāsmi śaśi-sūryayoḥ\npraṇavaḥ sarva-vedeṣu \nśabdaḥ khe pauruṣaṁ nṛṣu", "Magyar fordítás": "Ó, Kuntī fia! Én vagyok a víz íze, a nap és a hold fénye, az oṁ szótag a védikus mantrákban, a hang az éterben és az emberi képesség.", "Szavankénti fordítás": "rasaḥ – íz; aham – Én; apsu – a vízben; kaunteya – ó, Kuntī fia; prabhā – fény; asmi – vagyok; śaśi-sūryayoḥ – a napnak és a holdnak; praṇavaḥ – a három hang: a-u-m; sarva – mindben; vedeṣu – a Védákban; śabdaḥ – hangvibráció; khe – az éterben; pauruṣam – képesség; nṛṣu – az emberben."}, {"Félév": "2", "Kurzusnév": "Bhagavad-gītá 2.", "Vers / forrás": "8.5. VERS", "Versszöveg": "anta-kāle ca mām eva \nsmaran muktvā kalevaram\nyaḥ prayāti sa mad-bhāvaṁ \nyāti nāsty atra saṁśayaḥ", "Magyar fordítás": "Bárki legyen is az, ha élete végén egyedül Rám emlékezve hagyja el testét, minden kétséget kizárva azonnal eléri az Én természetemet.", "Szavankénti fordítás": "anta-kāle – az élet végén; ca – is; mām – Rám; eva – bizonyára; smaran – emlékezve; muktvā – elhagyva; kalevaram – a testet; yaḥ – aki; prayāti – megy; saḥ – ő; mat-bhāvam – az Én természetem; yāti – eléri; na – nem; asti – van; atra – itt; saṁśayaḥ – kétely."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītá 3.", "Vers / forrás": "9.22. VERS", "Versszöveg": "ananyāś cintayanto māṁ \nye janāḥ paryupāsate\nteṣāṁ nityābhiyuktānāṁ \nyoga-kṣemaṁ vahāmy aham", "Magyar fordítás": "De akik kizárólagos odaadással mindig Engem imádnak, transzcendentális formámon meditálva, azoknak elhozom, amire szükségük van, s megőrzöm, amijük van.", "Szavankénti fordítás": "ananyāḥ – minden más tárgy nélkül; cintayantaḥ – összpontosítva; mām – Rám; ye – akik; janāḥ – emberek; paryupāsate – helyesen imádnak; teṣām – az övék; nitya – mindig; abhiyuktānām – rendületlen az odaadásban; yoga – amire szükség van; kṣemam – védelem; vahāmi – elviszem; aham – Én."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītá 3.", "Vers / forrás": "9.26. VERS", "Versszöveg": "patraṁ puṣpaṁ phalaṁ toyaṁ \nyo me bhaktyā prayacchati\ntad ahaṁ bhakty-upahṛtam \naśnāmi prayatātmanaḥ", "Magyar fordítás": "Ha valaki szeretettel és odaadással áldoz Nekem egy levelet, egy virágot, egy gyümölcsöt vagy egy kevés vizet, Én elfogadom azt.", "Szavankénti fordítás": "patram – egy levelet; puṣpam – egy virágot; phalam – egy gyümölcsöt; toyam – vizet; yaḥ – bárki; me – Nekem; bhaktyā – odaadással; prayacchati – felajánl; tat – azt; aham – Én; bhakti-upahṛtam – odaadással ajánlott; aśnāmi – elfogadom; prayata-ātmanaḥ – attól, aki tiszta tudatú."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītá 3.", "Vers / forrás": "10.8. VERS", "Versszöveg": "ahaṁ sarvasya prabhavo \nmattaḥ sarvaṁ pravartate\niti matvā bhajante māṁ \nbudhā bhāva-samanvitāḥ", "Magyar fordítás": "Én vagyok az eredete a lelki és az anyagi világnak, minden Belőlem árad. A bölcsek, akik tudva tudják ezt, odaadóan szolgálnak és teljes szívből imádnak Engem.", "Szavankénti fordítás": "aham – Én; sarvasya – mindennek; prabhavaḥ – származásának forrása; mattaḥ – Tőlem; sarvam – minden; pravartate – árad; iti – így; matvā – tudván; bhajante – odaadóvá válnak; mām – Irántam; budhāḥ – a műveltek; bhāva-samanvitāḥ – nagy figyelemmel."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītá 3.", "Vers / forrás": "15.15. VERS", "Versszöveg": "sarvasya cāhaṁ hṛdi sanniviṣṭo\nmattaḥ smṛtir jñānam apohanaṁ ca\nvedaiś ca sarvair aham eva vedyo\nvedānta-kṛd veda-vid eva cāham", "Magyar fordítás": "Én mindenki szívében ott lakozom, s Tőlem jön az emlékezet, a tudás és a feledékenység. Én vagyok az, akit a Védákból meg kell ismerni, s Én vagyok a Vedānta szerkesztője és a Védák ismerője.", "Szavankénti fordítás": "sarvasya–mindenkiében; ca–és; aham–Én; hṛdi–szívben; sanniviṣṭaḥ–helyezkedvén; mattaḥ–Tőlem; smṛtiḥ–emlékezés; jñānam–tudás; apohanam–feledékenység; ca–és; vedaiḥ–a Védák által; ca–szintén; sarvaiḥ–mindegyik; aham–Én vagyok; eva–bizonyára; vedyaḥ–a megismerendő; vedānta-kṛt–a Vedānta szerkesztője; veda-vit–a Védák ismerője; eva–bizonyára; ca–és; aham–Én."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītá 3.", "Vers / forrás": "18.55. VERS", "Versszöveg": "bhaktyā mām abhijānāti \nyāvān yaś cāsmi tattvataḥ\ntato māṁ tattvato jñātvā \nviśate tad-anantaram", "Magyar fordítás": "Engem, az Istenség Legfelsőbb Személyiségét egyedül az odaadó szolgálat által lehet igazán megérteni. Ha valaki az ilyen odaadás révén tudatát teljesen Bennem merítette el, beléphet Isten birodalmába.", "Szavankénti fordítás": "bhaktyā – tiszta odaadó szolgálat által; mām – Engem; abhijānāti – megismerhet; yāvān – amennyire; yaḥ ca asmi – ahogyan vagyok; tattvataḥ – a valóságban; tataḥ – azután; mām – Engem; tattvataḥ – a valóságban; jñātvā – ismerve; viśate – belép; tat-anantaram – azután."}, {"Félév": "3", "Kurzusnév": "Bhagavad-gītá 3.", "Vers / forrás": "18.65. VERS", "Versszöveg": "man-manā bhava mad-bhakto \nmad-yājī māṁ namaskuru\nmām evaiṣyasi satyaṁ te \npratijāne priyo 'si me", "Magyar fordítás": "Gondolj mindig Rám, légy az Én hívem! Imádj Engem, és ajánld tiszteletedet Előttem, s így kétségtelenül el fogsz jutni Hozzám! Ezt megígérem neked, mert nagyon kedves barátom vagy.", "Szavankénti fordítás": "mat-manāḥ – Rám gondolva; bhava – legyél; mat-bhaktaḥ – az Én bhaktám; mat-yājī – az Én imádóm; mām – Nekem; namaskuru – ajánld fel hódolatodat; mām – Nekem; eva – bizonyára; eṣyasi – jönni fogsz; satyam – igazán; te – neked; pratijāne – megígérem; priyaḥ – kedves; asi – vagy; me – Nekem."}, {"Félév": "1", "Kurzusnév": "Bevezetés a védikus szentírásokba", "Vers / forrás": "Viṣṇu-purāṇa 3.6.28", "Versszöveg": "aṅgāni caturo vedā\nmīmāṁsā nyāya-vistaraḥ\npurāṇaṁ dharma-śāstrañ ca\nvidyā hy etāś caturdaśa", "Magyar fordítás": "A négy Véda és a hat aṅga, a mīmāṁsā, valamint a nyāya, a purāṇa és a dharma-śāstra szentíráscsoportok alkotják a tudás tizennégy ágát.", "Szavankénti fordítás": "aṅgāni – részek; caturaḥ – négy; vedāḥ – Vé-dák; mīmāṁsā – mīmāṁsā; nyāya-vistaraḥ – a nyāya részletes rendszere; purāṇam – a purāṇa; dharma-śāstram – a dharma-śāstra; ca – és; vidyāḥ –tudásterületek; hi – bizony; etāḥ – ezek; caturdaśa – tizennégy."}, {"Félév": "2", "Kurzusnév": "Filozófiai istentan", "Vers / forrás": "Bhaktivinoda Ṭhākura:\nDaśa-mūla-niryāsa", "Versszöveg": "āmnāyaḥ prāha tattvaṁ harim iha paramaṁ sarva-śaktiṁ rasābdhiṁ\ntad bhinnāṁśāṁś ca jīvān prakṛti-kavalitān tad-vimuktāṁś ca bhāvāt\nbhedābheda-prakāśaṁ sakalam api hareḥ sādhanaṁ śuddha-bhaktiṁ\nsādhyaṁ tat-prītim evety upadiśati janān gaura-candraḥ svayam saḥ", "Magyar fordítás": "A kinyilatkoztatott szentírás azt tanítja, hogy Hari, Kṛṣṇa a legfelsőbb igazság ebben a világban; Ő minden energiával rendelkezik, és Ő a rasa, minden lelki kapcsolat és szeretet óceánja. Az élőlények az Ő elkülönült részei: természetükből adódóan az anyagi energia hatása alá kerülhetnek, felszabadult állapotukban pedig mentesek annak befolyásól. Minden, ami létezik, Harihoz tartozik, és egyidejűleg azonos Vele és különbözik Tőle. A követendő lelki gyakorlat a tiszta odaadó szolgálat, az elérendő cél pedig az Iránta való tiszta szeretet. Ezt tanítja az embereknek személyesen Gaura-candra, az Úr Caitanya.", "Szavankénti fordítás": "āmnāyaḥ – a kinyilatkoztatott szentírás, a Védák hagyománya; prāha – kijelentette; tattvam – az igazságot; harim – Harit; iha – itt, ebben a világban; paramam – legfelsőbbnek; sarva-śaktim – minden energiával rendelkezőnek; rasa-abdhim – a rasa, azaz minden lelki kapcsolat és szeretet óceánjának; tad – az Ő; bhinna-aṁśān – elkülönült részeit; ca – és; jīvān – az élőlényeket; prakṛti-kavalitān – az anyagi természet által elnyelteket; tad-vimuktān – attól megszabadultakat; ca – és; bhāvāt – természetükből adódóan; bheda-abheda-prakāśam – az egyidejű azonosság és különbözőség megnyilvánulását; sakalam – mindent; api – is; hareḥ – Harié, Harival kapcsolatban álló; sādhanam – a gyakorlatot, a megvalósítás eszközét; śuddha-bhaktim – a tiszta odaadó szolgálatot; sādhyam – az elérendő célt; tat-prītim – az Iránta való szeretetet; eva – bizony; iti – így; upadiśati – tanítja; janān – az embereket; gaura-candraḥ – Gaura-candra, az Úr Caitanya; svayam – személyesen; saḥ – Ő."}, {"Félév": "5", "Kurzusnév": "Bhakti-raszámrita szindhu - Az odaadás nektárja", "Vers / forrás": "1.1.11. Vers", "Versszöveg": "anyābhilāṣitā-śūnyaṁ \njñāna-karmādy-anāvṛtam\nānukūlyena kṛṣṇānu-\nśīlanaṁ bhaktir uttamā", "Magyar fordítás": "Amikor az elsőrendű odaadó szolgálat kifejlődik, a bhaktának mentesnek kell lennie minden anyagi vágytól, monista filozófián keresztül szerzett tudástól és gyümölcsöző tettől. Mindig kedvezően kell szolgálnia Kṛṣṇát, úgy, ahogy Kṛṣṇa kívánja.", "Szavankénti fordítás": "anya-abhilāṣitā-śūnyam – minden olyan vágytól mentes, amely nem az Úr Kṛṣṇa szolgálatára irányul, azaz mentes az anyagi vágyaktól (mint amilyen a vágy a húsevésre, a törvénytelen nemi életre, a szerencsejátékra és a mámorítószerekhez való ragaszkodásra); jñāna – a monista māyāvādīk filozófiájának ismeretével; karma – gyümölcsöző tettek által; ādi – a természetellenes lemondással, a yoga gépies gyakorlásával, a sāṅkhya filozófia tanulmányozásával stb.; anāvṛtam – nincs befedve; ānukūlyena – kedvező; kṛṣṇa-anuśīlanam – a Kṛṣṇával kapcsolatos szolgálat végzése; bhaktiḥ uttamā – elsőrendű odaadó szolgálat."}, {"Félév": "5", "Kurzusnév": "Bhakti-raszámrita szindhu - Az odaadás nektárja", "Vers / forrás": "1.1.12. Vers", "Versszöveg": "sarvopādhi-vinirmuktaṁ\ntat-paratvena nirmalam\nhṛṣīkeṇa hṛṣīkeśa-\nsevanaṁ bhaktir ucyate", "Magyar fordítás": "A bhakti, az odaadó szolgálat azt jelenti, hogy minden érzékünket az Úrnak, az Istenség Legfelsőbb Személyiségének, minden érzék Urának a szolgálatába állítjuk. Annak, amikor a lélek a Legfelsőbbet szolgálja, két mellékhatása van: az ember megszabadul minden anyagi megjelöléstől, és érzékei megtisztulnak csupán attól, hogy az Úr szolgálatát végzik", "Szavankénti fordítás": "sarva-upādhi-vinirmuktam – mentes minden anyagi megjelöléstől, vagyis az Istenség Legfelsőbb Személyisége szolgálatának vágyán kívül minden vágytól mentes; tat-paratvena – az Istenség Legfelsőbb Személyisége szolgálatának egyedüli céljával; nirmalam – nem szennyezi be az elmélkedésre épülő filozófiai kutatás vagy a gyümölcsöző tevékenység; hṛṣīkeṇa – minden megjelöléstől mentes, megtisztult érzékekkel; hṛṣīka-īśa – az érzékek Urának; sevanam – a szolgálat az érzékek kielégítése érdekében; bhaktiḥ – odaadó szolgálatnak; ucyate – nevezik."}, {"Félév": "5", "Kurzusnév": "Bhakti-raszámrita szindhu - Az odaadás nektárja", "Vers / forrás": "1.2.225. Vers", "Versszöveg": "anāsaktasya viṣayān\nyathārham upayuñjataḥ\nnirbandhaḥ kṛṣṇa-sambandhe\nyuktaṁ vairāgyam ucyate", "Magyar fordítás": "Mindent az Úr szolgálata, s nem a személyes érzékkielégítés érdekében kell elfogadnunk. Ha valaki ragaszkodás nélkül fogad el valamit, s azért fogadja el, mert kapcsolatban áll Kṛṣṇával, lemondását yuktaṁ vairāgyamnak nevezik.", "Szavankénti fordítás": "anāsaktasya – a ragaszkodás nélküli személynek, viṣayān – az anyagi érzéktárgyakhoz; yathā-arham – ahhoz, hogy megfeleljen; upayuñjataḥ – lefoglelva; nirbandhaḥ – kötelék nélkül; kṛṣṇa-sambandhe – Kṛṣṇával való kapcsolatban; yuktam – megfelelő; vairāgyam – lemondás; ucyate – nevezik."}, {"Félév": "3", "Kurzusnév": "Vaisnava etikett és szertartástan", "Vers / forrás": "Śrī Vaiṣṇava-praṇāma", "Versszöveg": "vāñchā-kalpatarubhyaś ca\nkṛpā-sindhubhya eva ca\npatitānāṁ pāvanebhyo\nvaiṣṇavebhyo namo namaḥ", "Magyar fordítás": "Ajánljuk fel tiszteletteljes hódolatunkat az Úr összes vaiṣṇava hívének, akik olyanok, mint a mindenki óhaját teljesítő kívánságfák, és nagyon könyörületesek a bűnbeesett, feltételekhez kötött élőlények iránt.", "Szavankénti fordítás": "vāñchā-kalpa-tarubhyaḥ – azoknak, akik olyanok, mint a kívánságteljesítő fák; ca – is; kṛpā-sindhubhyaḥ – azoknak, akik a kegy óceánjai; eva – bizonyára; ca – és; patitānām – az elesett lelkeké; pāvanebhyaḥ – megtisztítóinak; vaiṣṇavebhyaḥ – a vaiṣṇaváknak; namaḥ namaḥ – ismételt hódolatok."}, {"Félév": "3", "Kurzusnév": "Vaisnava etikett és szertartástan", "Vers / forrás": "Śrīla Prabhupāda-praṇati", "Versszöveg": "nama oṁ viṣṇu-pādāya\nkṛṣṇa-preṣṭhāya bhū-tale\nśrīmate bhaktivedānta-\nsvāminn iti nāmine\nnamas te sārasvate deve\ngaura-vāṇī-pracāriṇe\nnirviśeṣa-śunyavādi-\npāścātya-deśa-tāriṇe", "Magyar fordítás": "Tiszteletteljes hódolatomat ajánlom ő Isteni Kegyelme A. C. Bhaktivedanta Swami Prabhupādának, aki nagyon kedves az Úr Kṛṣṇának, s az Ő lótuszlábainál keresett menedéket.\nTiszteletteljes hódolatomat ajánlom Neked, ó, lelki tanítómester, Sarasvatī Gosvāmī szolgája! Az Úr Caitanyadeva üzenetét prédikálod, s felszabadítod a nyugati világ országait, melyeket a személytelenség és üresség filozófiája hat át.", "Szavankénti fordítás": "namaḥ – hódolat; oṁ – megszólítás; viṣṇu-pādāya – annak, aki az Úr Viṣṇu lótuszlábainál keresett menedéket; kṛṣṇa-preṣṭhāya – aki nagyon kedves az Úr Kṛṣṇa számára; bhū-tale – a Földön; śrīmate – legcsodálatosabb; bhaktivedānta-svāmin – A. C. Bhaktivedanta Swami; iti – így; nāmine – nevezik.\nnamaḥ – hódolat; te – neked; sārasvate deve – Bhaktisiddhānta Sarasvatī Gosvāmī szolgájának; gaura-vāṇī – az Úr Caitanya üzenetét; pracāriṇe – aki prédikálod; nirviśeṣa – az imperszonalizmustól; śūnya-vādi – az ürességet hirdető tanoktól; pāścātya – a nyugati; deśa – országokat; tāriṇe – aki felszabadítod."}, {"Félév": "2", "Kurzusnév": "Upanisadok", "Vers / forrás": "Śrī Īśopaniṣad\nINVOKÁCIÓ", "Versszöveg": "oṁ pūrṇam adaḥ pūrṇam idaṁ\npūrṇāt pūrṇam udacyate\npūrṇasya pūrṇam ādāya\npūrṇam evāvaśiṣyate", "Magyar fordítás": "Az Istenség Személyisége tökéletes és teljes, és mivel maradéktalanul tökéletes, mindabban, ami Belőle kiárad – így ebben a mulandó világban is –, minden megvan ahhoz, hogy hiánytalanul teljes legyen. Bármit hozzon létre a Teljes Egész, az önmagában is teljes. Ő a Teljes Egész, ezért bár számtalan hiánytalan egység árad ki Belőle, megmarad teljes egésznek.", "Szavankénti fordítás": "oṁ – a Teljes Egész; pūrṇam – tökéletesen teljes; adaḥ – az; pūrṇam – tökéletesen teljes; idam – ez az érzékekkel felfogható világ; pūrṇāt – a teljesen tökéletestől; pūrṇam – teljes egység; udacyate – származik; pūrṇasya – a Teljes Egésztől; pūrṇam – mindegyiket, teljesen; ādāya – elvéve; pūrṇam – teljes egyensúly; eva – még akkor is; avaśiṣyate – megmarad."}, {"Félév": "2", "Kurzusnév": "Upanisadok", "Vers / forrás": "Śrī Īśopaniṣad\nELSő MANTRA", "Versszöveg": "īśāvāsyam idaṁ sarvaṁ\nyat kiñca jagatyāṁ jagat\ntena tyaktena bhuñjīthā\nmā gṛdhaḥ kasya svid dhanam", "Magyar fordítás": "A világegyetemen belül az Úr irányít minden élőt és élettelent, s minden az Övé. Az embernek ezért csupán azt szabad elfogadnia, amire szüksége van, s ami őt illeti meg. Minden mástól tartózkodnia kell, jól tudván, hogy az kihez tartozik.", "Szavankénti fordítás": "īśa – az Úr által; āvāsyam – irányított; idam – ez; sarvam – minden; yat kiñca – bármi; jagatyām – az univerzumon belül; jagat – minden élő és élettelen; tena – Általa; tyaktena – kiszabott hányad; bhuñjīthāḥ – el kell fogadnod; mā – ne; gṛdhaḥ – igyekezz megszerezni; kasya svid – senki másnak; dhanam – a kincsét."}, {"Félév": "5", "Kurzusnév": "Upadésámrita - A tanítások nektárja", "Vers / forrás": "1", "Versszöveg": "vāco vegaṁ manasaḥ krodha-vegaṁ\njihvā-vegam udaropastha-vegam\netān vegān yo viṣaheta dhīraḥ\nsarvām apīmāṁ pṛthivīṁ sa śiṣyāt", "Magyar fordítás": "Az a józan ember, aki ellen tud állni a beszéd késztetésének, az elme ösztönzésének, a düh tetteinek, valamint a nyelv, a gyomor és a nemi szervek késztetésének, alkalmas arra, hogy tanítványokat fogadjon el az egész világon.", "Szavankénti fordítás": "vācaḥ – a beszédnek; vegam – az ösztönzését; manasaḥ – az elmének; krodha – a dühnek; vegam – az ösztönzését; jihvā – a nyelvnek; vegam – az ösztönzését; udara-upastha – a gyomornak és a nemi szerveknek; vegam – az ösztönzését; etān – ezeket; vegān – az ösztönzéseket; yaḥ – bárki, aki; viṣaheta – el tudja tűrni; dhīraḥ – józan; sarvām – az egész; api – bizonyosan; imām – ezen; pṛthivīm – a világon; saḥ – az ilyen személy; śiṣyāt – tanítványokat fogadhat el.\nAz a józan ember, aki ellen tud állni a beszéd késztetésének, az elme ösztönzésének, a düh tetteinek, valamint a nyelv, a gyomor és a nemi szervek késztetésének, alkalmas arra, hogy tanítványokat fogadjon el az egész világon."}, {"Félév": "5", "Kurzusnév": "Upadésámrita - A tanítások nektárja", "Vers / forrás": "2", "Versszöveg": "atyāhāraḥ prayāsaś ca\nprajalpo niyamāgrahaḥ\njana-saṅgaś ca laulyaṁ ca\nṣaḍbhir bhaktir vinaśyati", "Magyar fordítás": "Az ember odaadó szolgálata megsemmisül, ha túlságosan belebonyolódik a következő hat cselekedetbe: 1. a szükségesnél több evés, vagy a szükségesnél több anyagi dolog felhalmozása; 2. túlzott igyekezet nehezen megszerezhető anyagi dolgok eléréséért; 3. haszontalan beszéd világi témákról; 4. az írások szabályozó elveinek betartása pusztán a szabályozott élet, nem pedig a lelki fejlődés kedvéért; vagy: az írások szabályozó elveinek elvetése és a tőlük független, önkényes cselekvés; 5. olyan világi gondolkodású emberek társaságának keresése, akiket nem érdekel a Kṛṣṇa-tudat; 6. mohó vágy anyagi eredményekre.", "Szavankénti fordítás": "ati-āhāraḥ – túl sok evés, vagy túl sok dolog felhalmozása; prayāsaḥ – túlzott erőfeszítés; ca – és; prajalpaḥ – haszontalan beszéd; niyama – szabályozó elvek; āgrahaḥ – túlzott ragaszkodás (vagy agrahaḥ – túlzott elhanyagolás); jana-saṅgaḥ – világi gondolkodású emberek társaságának keresése; ca – és; laulyam – heves vágyódás vagy mohóság; ca – és; ṣaḍbhiḥ – e hat miatt; bhaktiḥ – odaadó szolgálat; vinaśyati – elpusztul.\n"}, {"Félév": "5", "Kurzusnév": "Upadésámrita - A tanítások nektárja", "Vers / forrás": "3", "Versszöveg": "utsāhān niścayād dhairyāt\ntat-tat-karma-pravartanāt\nsaṅga-tyāgāt sato vṛtteḥ\nṣaḍbhir bhaktiḥ prasidhyati", "Magyar fordítás": "A tiszta odaadó szolgálat végzését hat alapelv követése befolyásolja kedvezően: 1. lelkesedés; 2. bizalommal teli törekvés; 3. türelem; 4. a szabályozó elvek szerinti cselekvés [például śravaṇaṁ kīrtanaṁ viṣṇoḥ smaraṇam – hallás és éneklés Kṛṣṇáról, emlékezés Kṛṣṇára]; 5. az abhakták társaságának kerülése; 6. az előző ācāryák nyomdokainak követése. Ennek a hat vezérelvnek a követése minden kétséget kizáróan biztosítja a tiszta odaadó szolgálat teljes sikerét.", "Szavankénti fordítás": "utsāhāt – lelkesedéssel; niścayāt – bizalommal; dhairyāt – türelemmel; tat-tat-karma – az odaadó szolgálatnak kedvező különféle tettek; pravartanāt – végzése által; saṅga-tyāgāt – az abhakták társaságának elkerülésével; sataḥ – a volt nagy ācāryák; vṛtteḥ – lábnyomainak követésével; ṣaḍbhiḥ – ezzel a hattal; bhaktiḥ – odaadó szolgálat; prasidhyati – fejlődik vagy sikeressé válik.\n"}, {"Félév": "5", "Kurzusnév": "Upadésámrita - A tanítások nektárja", "Vers / forrás": "4", "Versszöveg": "dadāti pratigṛhṇāti\nguhyam ākhyāti pṛcchati\nbhuṅkte bhojayate caiva\nṣaḍ-vidhaṁ prīti-lakṣaṇam", "Magyar fordítás": "Adományozás, adományok elfogadása, az elme bizalmas feltárása, bizalmas érdeklődés, prasāda elfogadása és felajánlása – ez a bhakták közötti szeretet hat jele.", "Szavankénti fordítás": "dadāti – adományt ad; pratigṛhṇāti – viszonzásul elfogad; guhyam – bensőséges témákat; ākhyāti – elmagyaráz; pṛcchati – érdeklődik; bhuṅkte – eszik; bhojayate – etet; ca – szintén; eva – bizonyosan; ṣaṭ-vidham – hatféle; prīti – a szeretetnek; lakṣaṇam – jelei."}, {"Félév": "4", "Kurzusnév": "Náma tattva - Harináma csintámani", "Vers / forrás": "Caitanya Caritāmṛta\nMadhya-līlā 17.133", "Versszöveg": "nāma cintāmaṇiḥ kṛṣṇaś \ncaitanya-rasa-vigrahaḥ\npūrṇaḥ śuddho nitya-mukto \n'bhinnatvān nāma-nāminoḥ", "Magyar fordítás": "Az Úr Kṛṣṇa neve a transzcendens bölcsek köve, a lelki ízek megtestesülése. Teljes, tiszta s örökké szabad. A név és viselője nem különbözik egymástól.", "Szavankénti fordítás": "nāmaḥ – a szent név; cintāmaṇiḥ – minden lelki áldás transzcendentálisan gyönyörteli adományozója; kṛṣṇaḥ – nem különbözik Kṛṣṇától; caitanya-rasa-vigrahaḥ – minden transzcendentális íz alakja; pūrṇaḥ – teljes; śuddhaḥ – tiszta, anyagi szennyeződés nélküli; nitya – örök; muktaḥ – felszabadult; abhinnatvāt – mivel nem különbözik; nāma – a szent névtől; nāminoḥ – és attól, aki a nevet viseli."}, {"Félév": "2", "Kurzusnév": "Varnásrama-dharma", "Vers / forrás": "Bhg.4.13. VERS", "Versszöveg": "cātur-varṇyaṁ mayā sṛṣṭaṁ\nguṇa-karma-vibhāgaśaḥ\ntasya kartāram api māṁ\nviddhy akartāram avyayam", "Magyar fordítás": "Az emberi társadalom négy osztályát Én teremtettem az anyagi természet három kötőereje és a rájuk jellemző munka szerint. Tudd meg, hogy bár Én vagyok e rendszer alkotója, Én mégis nem-cselekvő és változatlan vagyok!", "Szavankénti fordítás": "cātuḥ-varṇyam – az emberi társadalom négy rétege; mayā – Általam; sṛṣṭam – teremtett; guṇa – a tulajdonság; karma – és a munka; vibhāgaśaḥ – felosztása szerint; tasya – annak; kartāram – atyja; api – habár; mām – Én; viddhi – tudd hát; akartāram – nem cselekvőként; avyayam – változatlan."}, {"Félév": "3", "Kurzusnév": "Puránikus irodalom 1.", "Vers / forrás": "Śrīmad-Bhāgavatam\n1.2.11", "Versszöveg": "vadanti tat tattva-vidas\ntattvaṁ yaj jñānam advayam\nbrahmeti paramātmeti\nbhagavān iti śabdyate", "Magyar fordítás": "A bölcs transzcendentalisták, akik ismerik az Abszolút Igazságot, e kettősségtől mentes szubsztanciát Brahmannak, Paramātmānak vagy Bhagavānnak hívják.", "Szavankénti fordítás": "vadanti – azt mondják; tat – az; tattva-vidaḥ – a bölcs lelkek; tattvam – az Abszolút Igazság; yat – amely; jñānam – tudás; advayam – kettősségtől mentes; brahma iti – Brahmanként ismert; paramātmā iti – Paramātmāként ismert; bhagavān iti – Bhagavānként ismert; śabdyate – így hangzott."}, {"Félév": "3", "Kurzusnév": "Puránikus irodalom 1.", "Vers / forrás": "Śrīmad-Bhāgavatam\n1.3.28", "Versszöveg": "ete cāṁśa-kalāḥ puṁsaḥ\nkṛṣṇas tu bhagavān svayam\nindrāri-vyākulaṁ lokaṁ\nmṛḍayanti yuge yuge", "Magyar fordítás": "A fent említett inkarnációk vagy az Úr teljes részei, vagy az Úr teljes részeinek részei, ám az Úr Śrī Kṛṣṇa az eredeti Istenség Személyisége. Mindegyikük akkor jelenik meg a bolygókon, amikor a hitetlenek zavart okoznak. Az Úr alászáll, hogy megvédelmezze híveit.", "Szavankénti fordítás": "ete – mindezek; ca – és; aṁśa – teljes részek; kalāḥ – a teljes részek részei; puṁsaḥ – a Legfelsőbbé; kṛṣṇaḥ – az Úr Kṛṣṇa; tu – de; bhagavān – az Istenség Személyisége; svayam – személyesen; indra-ari – Indra ellenségei; vyākulam – megzavarták; lokam – minden bolygó; mṛḍayanti – megvédelmez; yuge yuge – a különböző korokban."}, {"Félév": "3", "Kurzusnév": "Puránikus irodalom 1.", "Vers / forrás": "Śrīmad-Bhāgavatam\n1.7.10", "Versszöveg": "sūta uvāca\nātmārāmāś ca munayo\nnirgranthā apy urukrame\nkurvanty ahaitukīṁ bhaktim\nittham-bhūta-guṇo hariḥ", "Magyar fordítás": "A különböző ātmārāmák [akik az ātmāból, a lelki önvalóból merítenek örömet], különösen azok, akik az önmegvalósítás útját járják, mentesek minden anyagi köteléktől, mégis arra vágynak, hogy tiszta odaadással szolgálhassák az Istenség Személyiségét. Ez azt jelenti, hogy az Úr transzcendentális tulajdonságokkal rendelkezik, ezért mindenki, még a felszabadult lelkek számára is vonzó.", "Szavankénti fordítás": " sūtaḥ uvāca—Sūta Gosvāmī mondta; ātmārāmāḥ—azok, akik az ātmāból merítenek örömet (ātmā általában: a lelki önvaló); ca—szintén; munayaḥ—bölcsek; nirgranthāḥ—mentes minden köteléktől; api—annak ellenére; urukrame—a nagy kalandok kedvelőjének; kurvanti—végeznek; ahaitukīm—tiszta; bhaktim—odaadó szolgálatot; ittham-bhūta—ilyen csodálatos; guṇaḥ—tulajdonságai; hariḥ—az Úrnak."}, {"Félév": "3", "Kurzusnév": "Puránikus irodalom 1.", "Vers / forrás": "Śrīmad-Bhāgavatam\n1.8.21", "Versszöveg": "kṛṣṇāya vāsudevāya\ndevakī-nandanāya ca\nnanda-gopa-kumārāya\ngovindāya namo namaḥ", "Magyar fordítás": "Ezért hadd ajánljam fel tiszteletteljes hódolatomat az Úrnak, aki Vasudeva fia, Devakī öröme, Nanda és Vṛndāvana többi tehénpásztorának fia, s aki boldoggá teszi a teheneket és az érzékeket!", "Szavankénti fordítás": "kṛṣṇāya—a Legfelsőbb Úr; vāsudevāya—Vāsudeva fiának; devakī-nandanāya—Devakī fiának; ca—és; nanda-gopa—Nanda és a tehénpásztorok; kumārāya—fiuknak; govindāya—az Istenség Személyiségének, aki örömet okoz a teheneknek és az érzékeknek; namaḥ—tiszteletteljes hódolat; namaḥ—hódolat."}, {"Félév": "3", "Kurzusnév": "Puránikus irodalom 1.", "Vers / forrás": "Śrīmad-Bhāgavatam\n1.8.22", "Versszöveg": "namaḥ paṅkaja-nābhāya\nnamaḥ paṅkaja-māline\nnamaḥ paṅkaja-netrāya\nnamas te paṅkajāṅghraye", "Magyar fordítás": "Tiszteletteljes hódolatom Neked, ó, Uram, akinek hasát egy lótuszvirágra hasonlító jel ékesíti, akit mindig lótuszvirágból készült füzér díszít, akinek pillantása olyan hűsítő, akár a lótusz, s akinek lábán lótuszvirágok lenyomata látható!", "Szavankénti fordítás": "namaḥ—tiszteletteljes hódolat; paṅkaja-nābhāya—az Úrnak, akinek a hasa közepén egy különleges mélyedés van, amely lótuszvirágra hasonlít; namaḥ—hódolat; paṅkaja-māline—akit mindig lótuszvirágból készült füzér díszít; namaḥ—hódolat; paṅkaja-netrāya—akinek pillantása olyan hűsítő, mint a lótuszvirág; namaḥ te—tiszteletteljes hódolat Neked; paṅkaja-aṅghraye—Neked, akinek talpán lótuszvirág lenyomata látható (s akiről ezért azt mondják, lótuszlábai vannak)."}, {"Félév": "4", "Kurzusnév": "Puránikus irodalom 2.", "Vers / forrás": "Śrīmad-Bhāgavatam\n2.9.33", "Versszöveg": "aham evāsam evāgre\nnānyad yat sad-asat param\npaścād ahaṁ yad etac ca\nyo 'vaśiṣyeta so 'smy aham", "Magyar fordítás": "Ó, Brahmā! Én vagyok az, az Istenség Személyisége, aki léteztem a teremtés előtt, amikor Rajtam kívül nem volt más. Nem létezett az anyagi természet sem, e teremtés oka. Én vagyok az is, amit most látsz, s ami a megsemmisülés után megmarad, az szintén Én leszek, az Istenség Személyisége.", "Szavankénti fordítás": "aham – Én, az Istenség Személyisége; eva – bizonyára; āsam – létezett; eva – csak; agre – a teremtés előtt; na – soha; anyat – bármi más; yat – mindazok; sat – az okozat; asat – az ok; param – a legfelsőbb; paścāt – a végén; aham – Én, az Istenség Személyisége; yat – mindezek; etat – teremtés; ca – szintén; yaḥ – minden; avaśiṣyeta – marad; saḥ – az; asmi – Én vagyok; aham – Én, az Istenség Személyisége."}, {"Félév": "4", "Kurzusnév": "Puránikus irodalom 2.", "Vers / forrás": "Śrīmad-Bhāgavatam\n2.9.34", "Versszöveg": "ṛte 'rthaṁ yat pratīyeta \nna pratīyeta cātmani\ntad vidyād ātmano māyāṁ\nyathābhāso yathā tamaḥ", "Magyar fordítás": "Ó, Brahmā! Ha nincs kapcsolatban Velem, minden valótlan, még akkor is, ha értékesnek tűnik. Tudnod kell róla, hogy csupán illuzórikus energiám – visszatükröződés a sötétségben.", "Szavankénti fordítás": "ṛte – nélkül; artham – érték; yat – ami; pratīyeta – úgy tűnik; na – nem; pratīyeta – úgy tűnik; ca – és; ātmani – Velem kapcsolatban; tat – az; vidyāt – tudnod kell; ātmanaḥ – Enyém; māyām – illuzórikus energia; yathā – ahogy; ābhāsaḥ – a visszatükröződés; yathā – mint; tamaḥ – a sötétség."}, {"Félév": "4", "Kurzusnév": "Puránikus irodalom 2.", "Vers / forrás": "Śrīmad-Bhāgavatam\n2.9.35", "Versszöveg": "yathā mahānti bhūtāni\nbhūteṣūccāvaceṣv anu\npraviṣṭāny apraviṣṭāni\ntathā teṣu na teṣv aham", "Magyar fordítás": "Ó, Brahmā! Tudd meg, hogy az univerzum elemei behatolnak a kozmoszba, ugyanakkor azonban nem is hatolnak bele! Hasonlóképpen Én Magam szintén jelen vagyok minden teremtett dologban, ám ugyanakkor mindenen kívül létezem.", "Szavankénti fordítás": "yathā – ahogy; mahānti – az univerzális; bhūtāni – elemek; bhūteṣu ucca-avaceṣu – a parányiban és a hatalmasban; anu – azután; praviṣṭāni – belépett; apraviṣṭāni – nem lépett be; tathā – így; teṣu – bennük; na – nem; teṣu – bennük; aham – Én."}, {"Félév": "4", "Kurzusnév": "Puránikus irodalom 2.", "Vers / forrás": "Śrīmad-Bhāgavatam\n2.9.36", "Versszöveg": "etāvad eva jijñāsyaṁ \ntattva-jijñāsunātmanaḥ\nanvaya-vyatirekābhyāṁ\nyat syāt sarvatra sarvadā", "Magyar fordítás": "Annak, aki a Legfelsőbb Abszolút Igazság, az Istenség Személyisége után kutat, minden bizonnyal eddig a pontig kell folytatnia a keresést, minden körülmények között, mindig és mindenhol, közvetlenül és közvetve.", "Szavankénti fordítás": "etāvat – eddig; eva – bizonyára; jijñāsyam – meg kell kérdezni; tattva – az Abszolút Igazság; jijñāsunā – a tanítvány által; ātmanaḥ – az Önvalónak; anvaya – közvetlenül; vyatirekābhyām – közvetve; yat – bármi; syāt – lehet; sarvatra – mindig, mindenhol; sarvadā – minden körülmények között."}, {"Félév": "5", "Kurzusnév": "Puránikus irodalom 3.", "Vers / forrás": "Śrīmad-Bhāgavatam\n3.25.21", "Versszöveg": "titikṣavaḥ kāruṇikāḥ\nsuhṛdaḥ sarva-dehinām\najāta-śatravaḥ śāntāḥ\nsādhavaḥ sādhu-bhūṣaṇāḥ", "Magyar fordítás": "Egy sādhura az jellemző, hogy türelmes, kegyes és barátságos minden élőlénnyel szemben. Nincsenek ellenségei, békés, engedelmeskedik a szentírásoknak, s minden tulajdonsága fenséges.", "Szavankénti fordítás": "titikṣavaḥ—türelmes; kāruṇikāḥ—kegyes; suhṛdaḥ—barátságos; sarva-dehinām—minden élőlényhez; ajāta-śatravaḥ—senkivel sem ellenséges; śāntāḥ—békés; sādhavaḥ—tiszteletben tartja a szentírásokat; sādhu-bhūṣaṇāḥ—fenséges tulajdonságok jellemzik."}, {"Félév": "5", "Kurzusnév": "Puránikus irodalom 3.", "Vers / forrás": "Śrīmad-Bhāgavatam\n3.25.25", "Versszöveg": "satāṁ prasaṅgān mama vīrya-saṁvido\nbhavanti hṛt-karṇa-rasāyanāḥ kathāḥ\ntaj-joṣaṇād āśv apavarga-vartmani\nśraddhā ratir bhaktir anukramiṣyati", "Magyar fordítás": "Amikor a tiszta bhakták egymás között az Istenség Legfelsőbb Személyisége kedvteléseiről és cselekedeteiről beszélgetnek, az rendkívül kellemes a fülnek és a szívnek, s végtelen elégedettséget nyújt nekik. E tudás művelésével az ember fokozatosan előrelép a felszabadulás útján, majd szabaddá válik, vonzódása megszilárdul, s elkezdődhet valódi odaadása és valódi odaadó szolgálata.", "Szavankénti fordítás": "satām—a tiszta bhaktáknak; prasaṅgāt—a társasága által; mama—Enyém; vīrya—csodálatos cselekedetek; saṁvidaḥ—erről beszélve; bhavanti—válik; hṛt—a szívnek; karṇa—a fülnek; rasa-ayanāḥ—kellemes; kathāḥ—a történetek; tat—annak; joṣaṇāt—művelése által; āśu—gyorsan; apavarga—felszabadulásnak; vartmani—az úton; śraddhā—szilárd hit; ratiḥ—vonzódás; bhaktiḥ—odaadás; anukramiṣyati—sorban követni fogja."}, {"Félév": "5", "Kurzusnév": "Puránikus irodalom 3.", "Vers / forrás": "Śrīmad-Bhāgavatam\n3.29.13", "Versszöveg": "sālokya-sārṣṭi-sāmīpya-\nsārūpyaikatvam apy uta\ndīyamānaṁ na gṛhṇanti\nvinā mat-sevanaṁ janāḥ", "Magyar fordítás": "Egy tiszta bhakta nem fogad el semmilyen felszabadulást − sem a sālokyát, sem a sārṣṭit, sem a sāmīpyát, sem a sārūpyát, sem az ekatvát −, még akkor sem, ha az Istenség Legfelsőbb Személyisége felkínálja neki.", "Szavankénti fordítás": "sālokya—ugyanazon a bolygón élni; sārṣṭi—ugyanolyan fenséggel rendelkezni; sāmīpya—személyes társnak lenni; sārūpya—ugyanolyan testi vonásokkal rendelkezni; ekatvam—egység; api—szintén; uta—még; dīyamānam—felajánlva; na—nem; gṛhṇanti—elfogad; vinā—nélkül; mat—Enyém; sevanam—odaadó szolgálat; janāḥ—tiszta bhakták."}, {"Félév": "5", "Kurzusnév": "Puránikus irodalom 3.", "Vers / forrás": "Śrīmad-Bhāgavatam\n3.33.7", "Versszöveg": "aho bata śva-paco ’to garīyān\nyaj-jihvāgre vartate nāma tubhyam\ntepus tapas te juhuvuḥ sasnur āryā\nbrahmānūcur nāma gṛṇanti ye te", "Magyar fordítás": "Ó, milyen dicsőségesek azok, kiknek nyelve szent nevedet énekli! Még akkor is méltóak az imádatra, ha kutyaevők családjában születtek meg. Akik szent nevedet éneklik, minden bizonnyal végrehajtottak minden lemondást és tűzáldozatot, szert tettek az āryanok jó tulajdonságaira, valamint kétségkívül megfürödtek már a szent zarándokhelyeken, tanulmányozták a Védákat, s eleget tettek minden követelménynek.", "Szavankénti fordítás": "aho bata—óh, milyen dicsőséges; śva-pacaḥ—egy kutyaevő; ataḥ—így; garīyān—imádandó; yat—akinek; jihvā-agre—a nyelv hegyén; vartate—van; nāma—a szent név; tubhyam—Neked; tepuḥ tapaḥ—lemondásokat végzett; te—ők; juhuvuḥ—tűzáldozatokat hajtott végre; sasnuḥ—megfürdött a szent folyókban; āryāḥ—āryanok; brahma anūcuḥ—tanulmányozta a Védákat; nāma—a szent név; gṛṇanti—elfogadják; ye—ők, akik; te—Tiéd."}, {"Félév": "6", "Kurzusnév": "Puránikus irodalom 4.", "Vers / forrás": "Śrīmad-Bhāgavatam\n4.3.23", "Versszöveg": "sattvaṁ viśuddhaṁ vasudeva-śabditaṁ\nyad īyate tatra pumān apāvṛtaḥ\nsattve ca tasmin bhagavān vāsudevo\nhy adhokṣajo me namasā vidhīyate", "Magyar fordítás": "Tiszta Kṛṣṇa-tudatban örökké hódolatomat ajánlom az Úr Vāsudevának. A Kṛṣṇa-tudat mindig tiszta tudat, amelyben az Istenség Legfelsőbb Személyisége, Vāsudeva leplezetlenül tárul felt az ember előtt.", "Szavankénti fordítás": "sattvam—tudat; viśuddham—tiszta; vasudeva—Vasudeva; śabditam—ismert; yat—mert; īyate—feltárul; tatra—ott; pumān—a Legfelsőbb Személy; apāvṛtaḥ—minden befedés nélkül; sattve—tudatban; ca—és; tasmin—abban; bhagavān—az Istenség Legfelsőbb Személyisége; vāsudevaḥ—Vāsudeva; hi—mert; adhokṣajaḥ—transzcendentális; me—általam; namasā—hódolattal; vidhīyate—imádott."}, {"Félév": "6", "Kurzusnév": "Puránikus irodalom 4.", "Vers / forrás": "Śrīmad-Bhāgavatam\n4.20.24", "Versszöveg": "na kāmaye nātha tad apy ahaṁ kvacin\na yatra yuṣmac-caraṇāmbujāsavaḥ\nmahattamāntar-hṛdayān mukha-cyuto\nvidhatsva karṇāyutam eṣa me varaḥ", "Magyar fordítás": "Drága Uram! Nem vágyom hát arra, hogy létedbe merüljek, nem vágyom egy olyan áldásra, amely nem adja meg nekem lótuszlábad nektári italát. Azt az áldást szeretném, hogy legyen legalább egymillió fülem, hogy tiszta híveid ajkairól lótuszlábad dicsőségéről halljak.", "Szavankénti fordítás": "na—nem; kāmaye—vágyom; nātha—óh, mester; tat—az; api—még; aham—én; kvacit—bármikor; na—nem; yatra—ahol; yuṣmat—Tiéd; caraṇa-ambuja—a lótuszlábé; āsavaḥ—a nektári ital; mahat-tama—a nagy bhaktáknak; antaḥ-hṛdayāt—a szívük mélyéből; mukha—a szájukból; cyutaḥ—átadva; vidhatsva—adj; karṇa—füleket; ayutam—egymilliót; eṣaḥ—ez; me—enyém; varaḥ—áldás."}, {"Félév": "6", "Kurzusnév": "Puránikus irodalom 4.", "Vers / forrás": "Śrīmad-Bhāgavatam\n4.22.39", "Versszöveg": "yat-pāda-paṅkaja-palāśa-vilāsa-bhaktyā\nkarmāśayaṁ grathitam udgrathayanti santaḥ\ntadvan na rikta-matayo yatayo ’pi ruddha-\nsroto-gaṇās tam araṇaṁ bhaja vāsudevam", "Magyar fordítás": "A bhakták, akik mindig az Úr lótuszlábujjainak szolgálatába merülnek, nagyon könnyen megoldhatják a gyümölcsöző cselekedetekre irányuló vágyak szorosra kötött csomóját. Ez nagyon nehéz dolog, ezért az abhakták, a jńānīk és a yogīk nem képesek erre, annak ellenére, hogy igyekeznek megállítani az érzékkielégítés hullámait. Próbálj ezért elmerülni Kṛṣṇa, Vasudeva fia odaadó szolgálatában!", "Szavankénti fordítás": "yat—akié; pāda—láb; paṅkaja—lótusz; palāśa—szirmok vagy lábujjak; vilāsa—élvezet; bhaktyā—odaadó szolgálattal; karma—gyümölcsöző cselekedetek; āśayam—vágy; grathitam—szoros csomó; udgrathayanti—gyökerestől kitép; santaḥ—bhakták; tat—az; vat—mint; na—soha; rikta-matayaḥ—azok, akik nem végeznek odaadó szolgálat; yatayaḥ—mindig jobban próbálva; api—noha; ruddha—megállított; srotaḥ-gaṇāḥ—az érzéki élvezet hullámai; tam—Neki; araṇam—méltó arra, hogy az oltalmát keressék; bhaja—odaadó szolgálatot végez; vāsudevam—Kṛṣṇának, Vasudeva fiának."}]};

let currentSzak = "Jógamester";
let currentVerses = [];
let currentIndex = 0;

// DOM elemek
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const navInfo = document.getElementById("navInfo");

const showPoem = document.getElementById("showPoem");
const showHun = document.getElementById("showHun");
const showWord = document.getElementById("showWord");
const threeWords = document.getElementById("threeWords");

const toggleFiltersBtn = document.getElementById("toggleFiltersBtn");
const filterPanel = document.getElementById("filterPanel");

const tabs = document.querySelectorAll(".tab");
const semEl = document.getElementById("sem");
const courseEl = document.getElementById("course");
const modeEl = document.getElementById("mode");
const searchEl = document.getElementById("search");
const fontSizeSlider = document.getElementById("fontSizeSlider");
