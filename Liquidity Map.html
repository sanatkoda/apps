<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éles Forex Liquidity & SMC Map</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #131722; color: #d1d4dc; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 320px; background-color: #1e222d; border-right: 1px solid #2a2e39; display: flex; flex-direction: column; padding: 15px; gap: 12px; flex-shrink: 0; overflow-y: auto; }
    h2 { font-size: 13px; color: #f0b90b; text-transform: uppercase; border-bottom: 1px solid #2a2e39; padding-bottom: 6px; margin-top: 5px; }
    
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 11px; color: #848e9c; font-weight: bold; }
    select, input { background: #2a2e39; border: 1px solid #363c4e; color: #d1d4dc; padding: 7px; border-radius: 4px; font-size: 12px; outline: none; }
    
    .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .toggle-btn { background: #2a2e39; border: 1px solid #f0b90b; color: #f0b90b; padding: 8px; border-radius: 4px; font-size: 11px; cursor: pointer; text-align: center; font-weight: bold; }
    .toggle-btn.inactive { background: #2a2e39; border-color: #363c4e; color: #848e9c; font-weight: normal; }
    
    #main { flex-grow: 1; display: flex; flex-direction: column; background: #131722; position: relative; }
    #header { height: 48px; border-bottom: 1px solid #2a2e39; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #1e222d; }
    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #0ecb81; }
    .status-dot.error { background: #f6465d; }
    
    #chart-container { flex-grow: 1; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h1 style="font-size:16px; color:#d1d4dc; margin-bottom:5px;">Twelve Data FX Map</h1>
    
    <div class="control-group">
      <label>Twelve Data API Key:</label>
      <input type="text" id="apiKeyInput" placeholder="Ide illeszd az API kulcsod">
    </div>

    <div class="control-group">
      <label>Devizapár & Idősík</label>
      <select id="symbolSelect">
        <option value="EUR/USD" selected>EUR/USD</option>
        <option value="GBP/USD">GBP/USD</option>
        <option value="USD/JPY">USD/JPY</option>
        <option value="AUD/USD">AUD/USD</option>
        <option value="USD/CAD">USD/CAD</option>
      </select>
      <select id="timeframeSelect">
        <option value="1min">1 perc (1m)</option>
        <option value="5min" selected>5 perc (5m)</option>
        <option value="15min">15 perc (15m)</option>
        <option value="1h">1 óra (1h)</option>
      </select>
    </div>

    <h2>Szintek</h2>
    <div class="toggle-grid">
      <div class="toggle-btn" data-toggle="bsl_ssl">BSL / SSL</div>
      <div class="toggle-btn" data-toggle="sweeps">Sweeps</div>
    </div>

    <h2>SMC Struktúra & DWF/OB</h2>
    <div class="toggle-grid">
      <div class="toggle-btn" data-toggle="bos_choch">BOS / CHoCH</div>
      <div class="toggle-btn" data-toggle="fvg">FVG (Gaps)</div>
      <div class="toggle-btn" data-toggle="ob">Order Blocks</div>
      <div class="toggle-btn inactive" data-toggle="heat">Strength Heat</div>
    </div>

    <h2>Munkamenet & HTF Szintek</h2>
    <div class="toggle-grid">
      <div class="toggle-btn" data-toggle="pdh_pdl">Prev Day H/L</div>
      <div class="toggle-btn inactive" data-toggle="asian">Asian H/L</div>
    </div>
  </div>

  <div id="main">
    <div id="header">
      <div style="font-weight: bold;" id="chartTitle">EUR/USD - 5m | Éles Liquidity Map</div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Várakozás adatra...</span>
      </div>
    </div>
    <div id="chart-container"></div>
  </div>

  <script>
    let API_KEY = "2c729e1c1a1840168a82136a5f04ee40";

    const config = {
      symbol: 'EUR/USD',
      interval: '5min',
      toggles: {
        bsl_ssl: true,
        sweeps: true,
        bos_choch: true,
        fvg: true,
        ob: true,
        heat: false,
        pdh_pdl: true,
        asian: false
      }
    };

    let chart, candleSeries;
    let candles = [];
    let priceLines = [];

    function initChart() {
      const container = document.getElementById('chart-container');
      chart = LightweightCharts.createChart(container, {
        layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
        priceScale: { borderColor: '#2a2e39' },
        timeScale: { borderColor: '#2a2e39', timeVisible: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#0ecb81', downColor: '#f6465d',
        borderUpColor: '#0ecb81', borderDownColor: '#f6465d',
        wickUpColor: '#0ecb81', wickDownColor: '#f6465d'
      });
    }

    async function fetchRealForex() {
      const inputKey = document.getElementById('apiKeyInput').value.trim();
      const key = inputKey || API_KEY;
      
      const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(config.symbol)}&interval=${config.interval}&outputsize=150&apikey=${key}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 'error' || !data.values) {
          document.getElementById('statusText').innerText = "Hiba: " + (data.message || "API limit / kulcs hiba");
          document.getElementById('statusDot').className = "status-dot error";
          return;
        }

        candles = data.values.reverse().map(d => ({
          time: Math.floor(new Date(d.datetime).getTime() / 1000),
          open: parseFloat(d.open),
          high: parseFloat(d.high),
          low: parseFloat(d.low),
          close: parseFloat(d.close)
        }));

        candleSeries.setData(candles);
        analyzeAllSMC();

        document.getElementById('statusText').innerText = `Éles FX Adat OK | ${new Date().toLocaleTimeString()}`;
        document.getElementById('statusDot').className = "status-dot";
      } catch (err) {
        document.getElementById('statusText').innerText = "Hálózati hiba / CORS tiltás";
        document.getElementById('statusDot').className = "status-dot error";
      }
    }

    function analyzeAllSMC() {
      // Vonalak törlése
      priceLines.forEach(l => candleSeries.removePriceLine(l));
      priceLines = [];
      if (candles.length < 15) return;

      const currentPrice = candles[candles.length - 1].close;
      const len = candles.length;
      let swings = [];

      for (let i = 2; i < len - 2; i++) {
        if (candles[i].high > candles[i-1].high && candles[i].high > candles[i+2].high) {
          swings.push({ type: 'SH', price: candles[i].high, candle: candles[i], index: i });
        }
        if (candles[i].low < candles[i-1].low && candles[i].low < candles[i+2].low) {
          swings.push({ type: 'SL', price: candles[i].low, candle: candles[i], index: i });
        }
      }

      // 1. BSL / SSL Szintek
      if (config.toggles.bsl_ssl) {
        const activeBSL = swings.filter(s => s.type === 'SH' && s.price > currentPrice).slice(-2);
        const activeSSL = swings.filter(s => s.type === 'SL' && s.price < currentPrice).slice(-2);

        activeBSL.forEach(s => {
          priceLines.push(candleSeries.createPriceLine({
            price: s.price, color: '#f6465d', lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed, title: 'BSL'
          }));
        });

        activeSSL.forEach(s => {
          priceLines.push(candleSeries.createPriceLine({
            price: s.price, color: '#0ecb81', lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed, title: 'SSL'
          }));
        });
      }

      // 2. Sweeps (Likviditás-söprés)
      if (config.toggles.sweeps) {
        for (let i = len - 10; i < len; i++) {
          swings.forEach(s => {
            if (s.index < i) {
              if (s.type === 'SH' && candles[i].high > s.price && candles[i].close < s.price) {
                priceLines.push(candleSeries.createPriceLine({
                  price: s.price, color: '#e91e63', lineWidth: 1,
                  lineStyle: LightweightCharts.LineStyle.LargeDashed, title: 'SWEEP (BSL)'
                }));
              }
              if (s.type === 'SL' && candles[i].low < s.price && candles[i].close > s.price) {
                priceLines.push(candleSeries.createPriceLine({
                  price: s.price, color: '#9c27b0', lineWidth: 1,
                  lineStyle: LightweightCharts.LineStyle.LargeDashed, title: 'SWEEP (SSL)'
                }));
              }
            }
          });
        }
      }

      // 3. BOS / CHoCH
      if (config.toggles.bos_choch && swings.length >= 2) {
        const lastSH = swings.filter(s => s.type === 'SH').pop();
        const lastSL = swings.filter(s => s.type === 'SL').pop();

        if (lastSH) {
          priceLines.push(candleSeries.createPriceLine({
            price: lastSH.price, color: '#ff9800', lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dotted, title: 'CHoCH / BOS High'
          }));
        }
        if (lastSL) {
          priceLines.push(candleSeries.createPriceLine({
            price: lastSL.price, color: '#00bcd4', lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dotted, title: 'CHoCH / BOS Low'
          }));
        }
      }

      // 4. Order Blocks (OB) Zónák
      if (config.toggles.ob && swings.length >= 2) {
        const lastSH = swings.filter(s => s.type === 'SH').pop();
        const lastSL = swings.filter(s => s.type === 'SL').pop();

        if (lastSH) {
          priceLines.push(candleSeries.createPriceLine({
            price: lastSH.candle.high, color: '#ff9800', lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Solid, title: 'Bearish OB (Top)'
          }));
        }
        if (lastSL) {
          priceLines.push(candleSeries.createPriceLine({
            price: lastSL.candle.low, color: '#2196f3', lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Solid, title: 'Bullish OB (Bottom)'
          }));
        }
      }

      // 5. FVG (Fair Value Gap) Imbalance
      if (config.toggles.fvg) {
        for (let i = len - 12; i < len - 1; i++) {
          // Bullish FVG
          if (candles[i-2].high < candles[i].low) {
            priceLines.push(candleSeries.createPriceLine({
              price: (candles[i-2].high + candles[i].low) / 2, color: '#00e676', lineWidth: 1,
              lineStyle: LightweightCharts.LineStyle.Solid, title: 'Bullish FVG'
            }));
          }
          // Bearish FVG
          if (candles[i-2].low > candles[i].high) {
            priceLines.push(candleSeries.createPriceLine({
              price: (candles[i-2].low + candles[i].high) / 2, color: '#ff1744', lineWidth: 1,
              lineStyle: LightweightCharts.LineStyle.Solid, title: 'Bearish FVG'
            }));
          }
        }
      }

      // 6. Prev Day High / Low (PDH/PDL)
      if (config.toggles.pdh_pdl) {
        const pdh = Math.max(...candles.slice(0, -20).map(c => c.high));
        const pdl = Math.min(...candles.slice(0, -20).map(c => c.low));

        priceLines.push(candleSeries.createPriceLine({
          price: pdh, color: '#e91e63', lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Solid, title: 'PDH'
        }));
        priceLines.push(candleSeries.createPriceLine({
          price: pdl, color: '#9c27b0', lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Solid, title: 'PDL'
        }));
      }
    }

    document.getElementById('apiKeyInput').addEventListener('change', () => fetchRealForex());

    document.getElementById('symbolSelect').addEventListener('change', (e) => {
      config.symbol = e.target.value;
      document.getElementById('chartTitle').innerText = `${config.symbol} - ${config.interval} | Éles Liquidity Map`;
      fetchRealForex();
    });

    document.getElementById('timeframeSelect').addEventListener('change', (e) => {
      config.interval = e.target.value;
      document.getElementById('chartTitle').innerText = `${config.symbol} - ${config.interval} | Éles Liquidity Map`;
      fetchRealForex();
    });

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-toggle');
        config.toggles[key] = !config.toggles[key];
        btn.classList.toggle('inactive', !config.toggles[key]);
        analyzeAllSMC();
      });
    });

    window.onload = () => {
      initChart();
      document.getElementById('apiKeyInput').value = API_KEY;
      fetchRealForex();
      setInterval(fetchRealForex, 60000);
    };
  </script>
</body>
</html>
