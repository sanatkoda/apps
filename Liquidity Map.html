<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éles Forex Liquidity Map (Twelve Data)</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #131722; color: #d1d4dc; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 300px; background-color: #1e222d; border-right: 1px solid #2a2e39; display: flex; flex-direction: column; padding: 15px; gap: 15px; flex-shrink: 0; }
    h2 { font-size: 15px; color: #f0b90b; text-transform: uppercase; border-bottom: 1px solid #2a2e39; padding-bottom: 8px; }
    
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: #848e9c; font-weight: bold; }
    select, input { background: #2a2e39; border: 1px solid #363c4e; color: #d1d4dc; padding: 8px; border-radius: 4px; font-size: 12px; outline: none; }
    
    .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .toggle-btn { background: #2a2e39; border: 1px solid #363c4e; color: #848e9c; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; text-align: center; }
    .toggle-btn.active { background: rgba(240, 185, 11, 0.15); border-color: #f0b90b; color: #f0b90b; font-weight: bold; }
    
    #main { flex-grow: 1; display: flex; flex-direction: column; background: #131722; position: relative; }
    #header { height: 48px; border-bottom: 1px solid #2a2e39; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #1e222d; }
    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #0ecb81; }
    .status-dot.error { background: #f6465d; }
    
    #chart-container { flex-grow: 1; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Twelve Data FX Map</h2>
    
    <div class="control-group">
      <label>Twelve Data API Key:</label>
      <input type="text" id="apiKeyInput" placeholder="Ide illeszd az API kulcsod">
    </div>

    <div class="control-group">
      <label>Devizapár & Idősík</label>
      <select id="symbolSelect">
        <option value="EUR/USD" selected>EUR/USD</option>
        <option value="GBP/USD">GBP/USD</option>
        <option value="USD/JPY">USD/JPY</option>
        <option value="AUD/USD">AUD/USD</option>
        <option value="USD/CAD">USD/CAD</option>
      </select>
      <select id="timeframeSelect">
        <option value="1min">1 perc (1m)</option>
        <option value="5min" selected>5 perc (5m)</option>
        <option value="15min">15 perc (15m)</option>
        <option value="1h">1 óra (1h)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Szintek</label>
      <div class="toggle-grid">
        <div class="toggle-btn active" data-toggle="bsl_ssl">BSL / SSL</div>
        <div class="toggle-btn active" data-toggle="sweeps">Sweeps</div>
        <div class="toggle-btn active" data-toggle="bos_choch">BOS / CHoCH</div>
        <div class="toggle-btn active" data-toggle="pdh_pdl">PDH / PDL</div>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="header">
      <div style="font-weight: bold;" id="chartTitle">EUR/USD - 5m | Éles Liquidity Map</div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Várakozás adatra...</span>
      </div>
    </div>
    <div id="chart-container"></div>
  </div>

  <script>
    // Beállítva a saját Twelve Data API kulcsod
    let API_KEY = localStorage.getItem('twelve_key') || '2c729e1c1a1840168a82136a5f04ee40';

    const config = {
      symbol: 'EUR/USD',
      interval: '5min',
      toggles: { bsl_ssl: true, sweeps: true, bos_choch: true, pdh_pdl: true }
    };

    let chart, candleSeries;
    let candles = [];
    let priceLines = [];

    function initChart() {
      const container = document.getElementById('chart-container');
      chart = LightweightCharts.createChart(container, {
        layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
        priceScale: { borderColor: '#2a2e39' },
        timeScale: { borderColor: '#2a2e39', timeVisible: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#0ecb81', downColor: '#f6465d',
        borderUpColor: '#0ecb81', borderDownColor: '#f6465d',
        wickUpColor: '#0ecb81', wickDownColor: '#f6465d'
      });
    }

    async function fetchRealForex() {
      const key = document.getElementById('apiKeyInput').value.trim() || API_KEY;
      const url = `https://api.twelvedata.com/time_series?symbol=${config.symbol}&interval=${config.interval}&outputsize=100&apikey=${key}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 'error' || !data.values) {
          document.getElementById('statusText').innerText = "Hiba: " + (data.message || "Hibás API kulcs");
          document.getElementById('statusDot').className = "status-dot error";
          return;
        }

        // Twelve Data időrendi sorrend megfordítása a lightweight-charts számára
        candles = data.values.reverse().map(d => ({
          time: new Date(d.datetime).getTime() / 1000,
          open: parseFloat(d.open),
          high: parseFloat(d.high),
          low: parseFloat(d.low),
          close: parseFloat(d.close)
        }));

        candleSeries.setData(candles);
        analyzeLiquidity();

        document.getElementById('statusText').innerText = `Éles FX Adat OK | ${new Date().toLocaleTimeString()}`;
        document.getElementById('statusDot').className = "status-dot";
      } catch (err) {
        document.getElementById('statusText').innerText = "Hálózati hiba lekéréskor";
        document.getElementById('statusDot').className = "status-dot error";
      }
    }

    function analyzeLiquidity() {
      priceLines.forEach(l => candleSeries.removePriceLine(l));
      priceLines = [];
      if (candles.length < 10) return;

      const len = candles.length;
      let swings = [];

      for (let i = 2; i < len - 2; i++) {
        if (candles[i].high > candles[i-1].high && candles[i].high > candles[i+2].high) {
          swings.push({ type: 'SH', price: candles[i].high });
        }
        if (candles[i].low < candles[i-1].low && candles[i].low < candles[i+2].low) {
          swings.push({ type: 'SL', price: candles[i].low });
        }
      }

      if (config.toggles.bsl_ssl) {
        swings.slice(-4).forEach(s => {
          const line = candleSeries.createPriceLine({
            price: s.price,
            color: s.type === 'SH' ? '#f6465d' : '#0ecb81',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            title: s.type === 'SH' ? 'BSL' : 'SSL'
          });
          priceLines.push(line);
        });
      }
    }

    // Eseménykezelők
    document.getElementById('apiKeyInput').addEventListener('change', (e) => {
      const val = e.target.value.trim();
      if (val) {
        localStorage.setItem('twelve_key', val);
        API_KEY = val;
      }
      fetchRealForex();
    });

    document.getElementById('symbolSelect').addEventListener('change', (e) => {
      config.symbol = e.target.value;
      document.getElementById('chartTitle').innerText = `${config.symbol} - ${config.interval} | Éles Liquidity Map`;
      fetchRealForex();
    });

    document.getElementById('timeframeSelect').addEventListener('change', (e) => {
      config.interval = e.target.value;
      document.getElementById('chartTitle').innerText = `${config.symbol} - ${config.interval} | Éles Liquidity Map`;
      fetchRealForex();
    });

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-toggle');
        config.toggles[key] = !config.toggles[key];
        btn.classList.toggle('active', config.toggles[key]);
        analyzeLiquidity();
      });
    });

    window.onload = () => {
      initChart();
      const savedKey = localStorage.getItem('twelve_key');
      document.getElementById('apiKeyInput').value = savedKey || API_KEY;
      fetchRealForex();
      setInterval(fetchRealForex, 15000); // 15 másodpercenkénti frissítés
    };
  </script>
</body>
</html>
